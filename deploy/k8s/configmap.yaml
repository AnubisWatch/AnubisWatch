apiVersion: v1
kind: ConfigMap
metadata:
  name: anubiswatch-config
  namespace: anubiswatch
data:
  anubis.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
      tls:
        enabled: false
      allowed_origins: ["*"]

    auth:
      type: local
      local:
        admin_email: admin@anubiswatch.local

    dashboard:
      enabled: true

    storage:
      path: /data
      encryption:
        enabled: false

    necropolis:
      enabled: false

    channels: []

    verdicts:
      rules: []
      escalation: []

    logging:
      level: info
      format: json
      output: stdout

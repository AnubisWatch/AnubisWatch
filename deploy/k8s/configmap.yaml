apiVersion: v1
kind: ConfigMap
metadata:
  name: anubiswatch-config
  namespace: anubiswatch
data:
  anubis.yaml: |
    server:
      host: 0.0.0.0
      port: 8080
      tls:
        enabled: false
      allowed_origins:
        - "http://localhost:8080"
        - "http://127.0.0.1:8080"

    auth:
      enabled: true
      type: local
      local:
        admin_email: admin@anubiswatch.local

    dashboard:
      enabled: true

    storage:
      path: /data
      encryption:
        enabled: true
        key: ${ANUBIS_ENCRYPTION_KEY}

    necropolis:
      enabled: false

    channels: []

    verdicts:
      rules: []
      escalation: []

    logging:
      level: info
      format: json
      output: stdout

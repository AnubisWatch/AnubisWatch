# Standalone AnubisWatch bundle.
#
# This aggregate mirrors the maintained split manifests in deploy/k8s/. It is
# intentionally single-node: the embedded store uses one ReadWriteOnce PVC and
# must not be mounted by concurrent standalone writers. Create the Secret data
# from a secret manager before applying this bundle; the empty Secret below
# makes missing credentials fail closed.
apiVersion: v1
kind: Namespace
metadata:
  name: anubiswatch
  labels:
    app.kubernetes.io/name: anubiswatch
    app.kubernetes.io/managed-by: kubectl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anubiswatch-config
  namespace: anubiswatch
data:
  anubis.yaml: |
    environment: production-proxied
    server:
      host: 0.0.0.0
      port: 8080
      grpc_port: 0
      tls:
        enabled: false
      allowed_origins:
        - "http://localhost:8080"
        - "http://127.0.0.1:8080"
    auth:
      enabled: true
      type: local
      local:
        admin_email: admin@anubiswatch.local
    dashboard:
      enabled: true
    storage:
      path: /data
      encryption:
        enabled: true
        key: ${ANUBIS_ENCRYPTION_KEY}
    necropolis:
      enabled: false
    logging:
      level: info
      format: json
      output: stdout
---
apiVersion: v1
kind: Secret
metadata:
  name: anubiswatch-secrets
  namespace: anubiswatch
type: Opaque
# Populate admin-password and encryption-key from a secret manager before use.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anubiswatch-data
  namespace: anubiswatch
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: anubiswatch
  namespace: anubiswatch
  labels:
    app.kubernetes.io/name: anubiswatch
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: anubiswatch
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubiswatch
  namespace: anubiswatch
  labels:
    app.kubernetes.io/name: anubiswatch
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anubiswatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anubiswatch
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anubiswatch
          image: ghcr.io/anubiswatch/anubiswatch:v0.1.4
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --config
            - /etc/anubis/anubis.yaml
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ANUBIS_CONFIG
              value: /etc/anubis/anubis.yaml
            - name: ANUBIS_DATA_DIR
              value: /data
            - name: ANUBIS_LOG_LEVEL
              value: info
            - name: ANUBIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anubiswatch-secrets
                  key: admin-password
            - name: ANUBIS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: anubiswatch-secrets
                  key: encryption-key
          volumeMounts:
            - name: config
              mountPath: /etc/anubis
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /var/lib/anubis
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: anubiswatch-config
        - name: runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: anubiswatch-data

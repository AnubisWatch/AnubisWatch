apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubiswatch
  namespace: anubiswatch
  labels:
    app.kubernetes.io/name: anubiswatch
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: anubiswatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anubiswatch
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anubiswatch
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          image: ghcr.io/anubiswatch/anubiswatch:v0.1.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ANUBIS_CONFIG
              value: /etc/anubis/anubis.yaml
            - name: ANUBIS_DATA_DIR
              value: /data
            - name: ANUBIS_LOG_LEVEL
              value: info
            - name: ANUBIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anubiswatch-secrets
                  key: admin-password
            - name: ANUBIS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: anubiswatch-secrets
                  key: encryption-key
          volumeMounts:
            - name: config
              mountPath: /etc/anubis
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /var/lib/anubis
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: anubiswatch-config
        - name: runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: anubiswatch-data

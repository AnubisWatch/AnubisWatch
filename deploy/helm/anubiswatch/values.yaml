# Default values for anubiswatch.
replicaCount: 1

image:
  repository: ghcr.io/anubiswatch/anubiswatch
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

automountServiceAccountToken: false
terminationGracePeriodSeconds: 30

podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000

service:
  type: ClusterIP
  httpPort: 8080
  # Management gRPC is disabled when 0. If set to a positive port, use
  # config.server.tls or bind config.server.host to an explicit loopback IP.
  grpcPort: 0
  clusterPort: 7946

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: anubiswatch.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

statefulSet:
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate

config:
  # Shipped manifests run behind an ingress/reverse proxy when promoted to
  # production. This permits internal HTTP while retaining the gRPC TLS gate.
  environment: production-proxied
  server:
    host: 0.0.0.0
    port: 8080
    tls:
      enabled: false
      cert: ""
      key: ""
      # Minimum TLS version for the HTTP and gRPC listeners.
      # 3 = TLS 1.2 (default), 4 = TLS 1.3. TLS 1.0/1.1 are rejected.
      min_version: 3
    trustedProxies: []
    # REQUIRED for browser access outside localhost. Set this to the exact
    # public origin of your ingress (for example https://anubiswatch.example.com).
    # The defaults below support only local port-forwarding.
    allowedOrigins:
      - "http://localhost:8080"
      - "http://127.0.0.1:8080"

  dashboard:
    enabled: true

  auth:
    type: local
    local:
      adminEmail: admin@anubiswatch.local

  storage:
    path: /data
    encryption:
      enabled: false

  necropolis:
    enabled: false

  logging:
    level: info
    format: json

secrets:
  # Required. Set with --set secrets.adminPassword='...' or a values file.
  # Must be at least 12 characters and contain at least 3 of:
  # uppercase, lowercase, digits, special characters. Placeholder/default
  # values such as admin, password, and CHANGE_ME are rejected.
  adminPassword: ""
  encryptionKey: ""
  clusterSecret: ""

nodeSelector: {}

tolerations: []

affinity: {}

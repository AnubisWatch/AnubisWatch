# Default values for anubiswatch.
replicaCount: 1

image:
  repository: ghcr.io/anubiswatch/anubiswatch
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1000

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9090
  clusterPort: 7946

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: anubiswatch.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1

monitoring:
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi

statefulSet:
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate

config:
  server:
    port: 8080
    tls:
      enabled: false
      cert: ""
      key: ""
      min_version: 3    # TLS 1.2 minimum (3=TLS1.2, 4=TLS1.3)
      prefer_server: true
    trustedProxies: []
    allowedOrigins:
      - "http://localhost:8080"
      - "http://127.0.0.1:8080"

  dashboard:
    enabled: true

  auth:
    type: local
    local:
      adminEmail: admin@anubiswatch.local

  storage:
    path: /data
    encryption:
      enabled: false

  necropolis:
    enabled: false

  logging:
    level: info
    format: json

secrets:
  # Required. Set with --set secrets.adminPassword='...' or a values file.
  # Must be at least 12 characters and contain at least 3 of:
  # uppercase, lowercase, digits, special characters. Placeholder/default
  # values such as admin, password, and CHANGE_ME are rejected.
  adminPassword: ""
  encryptionKey: ""
  clusterSecret: ""

nodeSelector: {}

tolerations: []

affinity: {}

# Example production values for AnubisWatch.
#
# Copy this file to an environment-specific values file outside version
# control, then fill secrets from the deployment secret store. Do not commit
# real production values or secret material.

replicaCount: 1

image:
  repository: ghcr.io/anubiswatch/anubiswatch
  # Prefer immutable digests for production promotion. Example:
  # tag: "sha-ae2a2cf"
  tag: ""
  pullPolicy: IfNotPresent

# The supported production example is single-node. Necropolis clustering is
# disabled below, so the Deployment uses replicaCount rather than this value.
statefulSet:
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 50Gi

config:
  server:
    port: 8080
    # TLS terminates at the ingress configured below. Pod traffic is HTTP
    # inside the cluster, so no nonexistent certificate paths are advertised.
    tls:
      enabled: false
      cert: ""
      key: ""
      min_version: 3
      prefer_server: true
    # trustedProxies: IPs of your ingress proxy (nginx/Traefik) to enable
    # X-Forwarded-For support. Without this, XFF is ignored (spoofing safe).
    # Example:
    # trustedProxies:
    #   - "10.244.0.0/16"
    trustedProxies: []
    allowedOrigins:
      - "https://anubiswatch.example.com"

  dashboard:
    enabled: true

  auth:
    type: local
    local:
      adminEmail: admin@example.com

  storage:
    path: /data
    encryption:
      enabled: true

  # The currently supported production topology is a single node.
  necropolis:
    enabled: false

  logging:
    level: warn
    format: json

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9090
  clusterPort: 7946

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: anubiswatch.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - anubiswatch.example.com
      secretName: anubiswatch-tls

monitoring:
  # Set to true only when the Prometheus Operator ServiceMonitor CRD exists in
  # the target cluster.
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

pdb:
  # A minAvailable: 1 PDB deadlocks voluntary disruption of a single replica.
  enabled: false
  minAvailable: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

secrets:
  # Required. Fill in the real environment values file or pass with --set /
  # --set-file from your deployment secret store.
  adminPassword: ""
  # Required because config.storage.encryption.enabled is true.
  encryptionKey: ""
  # Only required when necropolis clustering is enabled.
  clusterSecret: ""

nodeSelector: {}

tolerations: []

affinity: {}

# Example production values for AnubisWatch.
#
# Copy this file to an environment-specific values file outside version
# control, then fill secrets from the deployment secret store. Do not commit
# real production values or secret material.

replicaCount: 1

image:
  repository: ghcr.io/anubiswatch/anubiswatch
  # Prefer immutable digests for production promotion. Example:
  # tag: "sha-ae2a2cf"
  tag: ""
  pullPolicy: IfNotPresent

statefulSet:
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 50Gi

config:
  server:
    port: 8080
    # TLS: enable once cert and key are mounted via cert-manager or secrets.
    # MinVersion: 0=default, 1=TLS1.0, 2=TLS1.1, 3=TLS1.2, 4=TLS1.3.
    # Prefer TLS 1.3 in production where supported.
    tls:
      enabled: false  # Set to true and mount cert/key for production
      cert: ""        # e.g. /etc/anubis/tls.crt
      key: ""         # e.g. /etc/anubis/tls.key
      min_version: 3   # TLS 1.2 minimum (recommended for production)
      prefer_server: true
    # trustedProxies: IPs of your ingress proxy (nginx/Traefik) to enable
    # X-Forwarded-For support. Without this, XFF is ignored (spoofing safe).
    # Example:
    # trustedProxies:
    #   - "10.244.0.0/16"
    trustedProxies: []
    allowedOrigins:
      - "https://anubiswatch.example.com"

  dashboard:
    enabled: true

  auth:
    type: local
    local:
      adminEmail: admin@example.com

  storage:
    path: /data
    encryption:
      enabled: false

  necropolis:
    enabled: true

  logging:
    level: warn
    format: json

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9090
  clusterPort: 7946

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: anubiswatch.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - anubiswatch.example.com
      secretName: anubiswatch-tls

monitoring:
  # Set to true only when the Prometheus Operator ServiceMonitor CRD exists in
  # the target cluster.
  enabled: false
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s

pdb:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

secrets:
  # Required. Fill in the real environment values file or pass with --set /
  # --set-file from your deployment secret store.
  adminPassword: ""
  encryptionKey: ""
  clusterSecret: ""

nodeSelector: {}

tolerations: []

affinity: {}

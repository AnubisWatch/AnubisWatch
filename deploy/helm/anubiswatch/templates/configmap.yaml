{{- include "anubiswatch.clusterValidation" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "anubiswatch.fullname" . }}-config
  labels:
    {{- include "anubiswatch.labels" . | nindent 4 }}
data:
  {{- if .Values.config.necropolis.enabled }}
  {{- range $ordinal := until 3 }}
  anubis-{{ $ordinal }}.yaml: |
    {{- include "anubiswatch.runtimeConfig" (dict "root" $ "ordinal" $ordinal) | nindent 4 }}
  {{- end }}
  {{- else }}
  anubis.yaml: |
    {{- include "anubiswatch.runtimeConfig" (dict "root" .) | nindent 4 }}
  {{- end }}

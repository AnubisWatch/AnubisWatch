{{- if not .Values.config.necropolis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anubiswatch.fullname" . }}
  labels:
    {{- include "anubiswatch.labels" . | nindent 4 }}
spec:
  {{- if gt (int .Values.replicaCount) 1 }}
  {{- fail "replicaCount must be 1 when config.necropolis.enabled=false; a standalone embedded store cannot safely share one PVC across replicas" }}
  {{- end }}
  {{- if .Values.autoscaling.enabled }}
  {{- fail "autoscaling.enabled must be false when config.necropolis.enabled=false; use an explicitly formed and validated cluster instead" }}
  {{- end }}
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "anubiswatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "anubiswatch.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "anubiswatch.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --config
            - /etc/anubis/anubis.yaml
            {{- if .Values.config.necropolis.enabled }}
            - --cluster
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            {{- if gt (int .Values.service.grpcPort) 0 }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            {{- end }}
            {{- if .Values.config.necropolis.enabled }}
            - name: raft
              containerPort: {{ .Values.service.clusterPort }}
              protocol: TCP
            {{- end }}
          env:
            - name: ANUBIS_CONFIG
              value: /etc/anubis/anubis.yaml
            - name: ANUBIS_DATA_DIR
              value: /data
            - name: ANUBIS_LOG_LEVEL
              value: {{ .Values.config.logging.level }}
            - name: ANUBIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anubiswatch.fullname" . }}-secrets
                  key: admin-password
            {{- if .Values.secrets.encryptionKey }}
            - name: ANUBIS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "anubiswatch.fullname" . }}-secrets
                  key: encryption-key
            {{- end }}
            {{- if .Values.secrets.clusterSecret }}
            - name: ANUBIS_CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "anubiswatch.fullname" . }}-secrets
                  key: cluster-secret
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/anubis
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /var/lib/anubis
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "anubiswatch.fullname" . }}-config
        - name: runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "anubiswatch.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}

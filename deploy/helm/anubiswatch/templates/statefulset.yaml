{{- if .Values.config.necropolis.enabled }}
{{- include "anubiswatch.clusterValidation" . }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "anubiswatch.fullname" . }}
  labels:
    {{- include "anubiswatch.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "anubiswatch.fullname" . }}-headless
  replicas: {{ .Values.statefulSet.replicas }}
  podManagementPolicy: {{ .Values.statefulSet.podManagementPolicy }}
  updateStrategy:
    type: {{ .Values.statefulSet.updateStrategy.type }}
  selector:
    matchLabels:
      {{- include "anubiswatch.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with omit .Values.podAnnotations "checksum/config" "checksum/secrets" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "anubiswatch.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "anubiswatch.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: anubis
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "anubiswatch.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              ordinal="${HOSTNAME##*-}"
              case "$ordinal" in 0|1|2) ;; *) echo "unexpected voter ordinal" >&2; exit 1 ;; esac
              exec /bin/anubis serve --cluster --config "$ANUBIS_CONFIG"
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            {{- if gt (int .Values.service.grpcPort) 0 }}
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            {{- end }}
            - name: raft
              containerPort: {{ .Values.service.clusterPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/anubis
              readOnly: true
            - name: data
              mountPath: {{ .Values.config.storage.path | quote }}
            - name: raft-tls
              mountPath: /etc/anubis/raft-tls
              readOnly: true
            - name: runtime
              mountPath: /var/lib/anubis
            - name: tmp
              mountPath: /tmp
          env:
            - name: ANUBIS_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ANUBIS_CONFIG
              value: /etc/anubis/$(ANUBIS_NODE_ID).yaml
            - name: ANUBIS_DATA_DIR
              value: {{ .Values.config.storage.path | quote }}
            - name: ANUBIS_LOG_LEVEL
              value: {{ .Values.config.logging.level | quote }}
            - name: ANUBIS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anubiswatch.secretName" . }}
                  key: admin-password
            {{- if include "anubiswatch.hasEncryptionKey" . }}
            - name: ANUBIS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "anubiswatch.secretName" . }}
                  key: encryption-key
            {{- end }}
            {{- if include "anubiswatch.hasClusterSecret" . }}
            - name: ANUBIS_CLUSTER_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "anubiswatch.secretName" . }}
                  key: cluster-secret
            {{- end }}
            {{- if include "anubiswatch.hasMailPassword" . }}
            - name: ANUBIS_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "anubiswatch.secretName" . }}
                  key: mail-password
                  optional: {{ not .Values.secrets.mailPassword }}
            {{- end }}
            - name: ANUBIS_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
      volumes:
        - name: config
          configMap:
            name: {{ include "anubiswatch.configName" . }}
            items:
              {{- range $ordinal := until 3 }}
              - key: anubis-{{ $ordinal }}.yaml
                path: {{ include "anubiswatch.fullname" $ }}-{{ $ordinal }}.yaml
              {{- end }}
        - name: raft-tls
          secret:
            secretName: {{ .Values.cluster.raftTLSSecret | quote }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        - name: runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "anubiswatch.selectorLabels" . | nindent 18 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        accessModes:
          - {{ .Values.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
{{- end }}

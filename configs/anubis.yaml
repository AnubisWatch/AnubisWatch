# AnubisWatch Configuration
server:
  host: "0.0.0.0"
  port: 8080
  tls:
    enabled: false

storage:
  path: "./data"

dashboard:
  enabled: true
  branding:
    title: "AnubisWatch"
    theme: "auto"

logging:
  level: "info"
  format: "text"
  output: "stdout"      # stdout | stderr | file | both
  # file: ""            # default <storage.path>/logs/anubis.log
  # max_size_mb: 100    # file|both: rotate at this size
  # max_backups: 5      # file|both: rotated files kept

# Probe engine tuning. max_concurrent_checks caps scheduled + manual checks
# running at once on this node (default 100, valid 1-10000).
probe:
  max_concurrent_checks: 100

# Alert channels ignore HTTP(S)_PROXY (an implicit proxy would bypass the SSRF
# policy). Set an explicit proxy only if this host can reach Slack, webhooks
# and other HTTP channels solely through one.
# alerting:
#   proxy: "http://proxy.internal:3128"

# Outgoing mail for status page subscriptions (double opt-in confirmation,
# incident updates, unsubscribe links) and "Forgot password?" reset links.
# Off unless mail.host is set; server.public_url is then required, because the
# emails link back to it. The relay is dialed through the SSRF policy.
# server:
#   public_url: "https://status.example.com"
# mail:
#   host: "smtp.example.com"
#   port: 587                       # default 587, or 465 with tls: implicit
#   username: "anubis@example.com"
#   password: "${ANUBIS_MAIL_PASSWORD}"
#   from: "AnubisWatch <status@example.com>"
#   tls: "starttls"                 # starttls (default) | implicit | none
#   timeout: "30s"

souls:
  - name: "Google DNS"
    type: "dns"
    target: "8.8.8.8"
    weight: "30s"
    timeout: "5s"
    enabled: true
    tags:
      - "production"
      - "dns"
    dns:
      record_type: "A"
      expected:
        - "8.8.8.8"

  - name: "Cloudflare DNS"
    type: "dns"
    target: "1.1.1.1"
    weight: "30s"
    timeout: "5s"
    enabled: true
    tags:
      - "production"
      - "dns"
    dns:
      record_type: "A"
      expected:
        - "1.1.1.1"

  - name: "HTTPbin Health"
    type: "http"
    target: "https://httpbin.org/get"
    weight: "60s"
    timeout: "10s"
    enabled: true
    tags:
      - "example"
    http:
      method: "GET"
      valid_status:
        - 200

channels:
  - name: "Admin Alerts"
    type: "email"
    enabled: true
    email:
      smtp_host: "smtp.example.com"
      smtp_port: 587
      from: "anubis@example.com"
      to:
        - "admin@example.com"

verdicts:
  rules:
    - name: "Critical Alert"
      enabled: true
      scope:
        type: "all"
      conditions:
        - type: "status_change"
          from: "alive"
          to: "dead"
      channels:
        - "Admin Alerts"

codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 80%
        threshold: 0%
        base: auto
    patch:
      default:
        target: 80%
        threshold: 0%
        base: auto

flags:
  backend:
    paths:
      - cmd/
      - internal/
    carryforward: false
  frontend:
    paths:
      - web/src/
    carryforward: false

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false

# Generated protobuf bindings are the only project-source coverage exception.
ignore:
  - "internal/grpcapi/v1/*.pb.go"

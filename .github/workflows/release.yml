name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; each job that publishes asks for exactly what it
# needs, so third-party build steps (pnpm install, go build) never hold a
# write token.
permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci-gate:
    name: Verify Exact-SHA CI Success
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release-commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for release commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseSha = process.env.RELEASE_SHA;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: releaseSha,
              status: 'success',
              per_page: 100,
            });
            const run = data.workflow_runs.find(candidate =>
              candidate.event === 'push' &&
              ['main', 'master', 'develop'].includes(candidate.head_branch)
            );
            if (!run) {
              core.setFailed(`No successful protected-branch push run of ci.yml found for exact release SHA ${releaseSha}`);
              return;
            }
            core.info(`Release SHA ${releaseSha} passed CI: ${run.html_url}`);

  preflight:
    name: Release Preflight
    runs-on: ubuntu-latest
    needs: ci-gate
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test -timeout 10m ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./... 2>&1 | tee /tmp/vuln.out
          grep -Eq '^(No vulnerabilities found\.|Your code is affected by 0 vulnerabilities\.)' /tmp/vuln.out

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint web application
        working-directory: web
        run: pnpm run lint

      - name: Test web application
        working-directory: web
        run: pnpm run test

      - name: Build web application
        working-directory: web
        run: pnpm run build

      - name: Audit web dependencies
        working-directory: web
        run: pnpm audit --audit-level high

  build-binaries:
    name: Build Binaries
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: linux
            arch: arm
            goarm: '7'
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: freebsd
            arch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build dashboard (if exists)
        run: |
          if [ -f web/package.json ]; then
            cd web
            pnpm install --frozen-lockfile
            pnpm run build:embed
            echo "Embedded dashboard built successfully"
          else
            echo "No web/dashboard found (web/package.json missing), skipping dashboard build"
          fi

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          CGO_ENABLED=0 go build \
            -ldflags "-s -w \
              -X main.Version=${{ github.ref_name }} \
              -X main.Commit=${{ github.sha }} \
              -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o anubis-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.os == 'windows' && '.exe' || '' }} \
            ./cmd/anubis

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anubis-${{ matrix.os }}-${{ matrix.arch }}
          path: anubis-${{ matrix.os }}-${{ matrix.arch }}*

      - name: Create tarball
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip anubis-${{ matrix.os }}-${{ matrix.arch }}.zip anubis-${{ matrix.os }}-${{ matrix.arch }}.exe
          else
            tar -czf anubis-${{ matrix.os }}-${{ matrix.arch }}.tar.gz anubis-${{ matrix.os }}-${{ matrix.arch }}
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anubis-${{ matrix.os }}-${{ matrix.arch }}-archive
          path: |
            *.tar.gz
            *.zip

  release:
    name: Create Release
    runs-on: ubuntu-latest
    # The image scan gates the GitHub release too, so a blocked image never
    # leaves a published release behind.
    needs: [build-binaries, docker]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD~1)..HEAD >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: '*-archive'
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/ || true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > checksums.txt

      # Signed SLSA build provenance for every archive, verifiable with
      # `gh attestation verify <file> --repo AnubisWatch/anubiswatch`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: AnubisWatch ${{ github.ref_name }}
          body: |
            ⚖️ **AnubisWatch — The Judgment Never Sleeps**

            ${{ steps.changelog.outputs.CHANGELOG }}

            ## Installation

            ### Binary
            Download the appropriate binary for your platform and run:
            ```bash
            ./anubis init
            ./anubis serve
            ```

            ### Docker
            ```bash
            docker run -d \
              -p 8080:8080 \
              -v anubis-data:/data \
              -e ANUBIS_ADMIN_PASSWORD="$ANUBIS_ADMIN_PASSWORD" \
              --read-only --tmpfs /var/lib/anubis \
              ghcr.io/anubiswatch/anubiswatch:${{ github.ref_name }}
            ```

            ## Verification
            See checksums.txt for SHA256 checksums of all artifacts. Every
            archive also carries signed build provenance:
            ```bash
            gh attestation verify anubis-linux-amd64.tar.gz --repo AnubisWatch/anubiswatch
            ```
          files: |
            artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

  docker:
    name: Scan and Publish Docker Images
    runs-on: ubuntu-latest
    needs: [preflight, build-binaries]
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          # Only push to ghcr.io — Docker Hub (anubiswatch/anubis) is not
          # configured in this workflow's secrets and would 401 on push.
          # The docker-build.yml workflow already publishes to ghcr.io on
          # every main commit; release adds the semver tags here.
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Compute shared image build stamp
        id: image-stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build scan candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: anubiswatch-release-scan:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.image-stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run blocking Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: anubiswatch-release-scan:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-release-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy scan results
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: 'trivy-release-results.sarif'

      - name: Publish multi-platform image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.image-stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

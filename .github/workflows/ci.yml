name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  GO_VERSION: '1.26.3'
  NODE_VERSION: '22'
  ANUBIS_DATA_DIR: /tmp/anubis
  ANUBIS_CONFIG: /tmp/anubis.json
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Backend Tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Create test directories
        run: |
          mkdir -p /tmp/anubis-data
          chmod 700 /tmp/anubis-data

      - name: Run tests with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ./...
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data
          ANUBIS_CONFIG: /tmp/anubis-test.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: Check coverage threshold (excluding generated code)
        run: |
          # Exclude generated protobuf code from coverage calculation
          grep -v "internal/grpcapi/v1/" coverage.out > coverage-filtered.out || true
          COVERAGE=$(go tool cover -func=coverage-filtered.out | grep total | awk '{print $3}' | sed 's/%//' | cut -d. -f1)
          echo "Total coverage (excluding generated): $COVERAGE%"
          if [ "$COVERAGE" -lt 75 ]; then
            echo "Coverage $COVERAGE% is below threshold 75%"
            exit 1
          fi

  # Frontend Tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run linter
        working-directory: web
        run: npm run lint

      - name: Run tests
        working-directory: web
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./web/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # Dashboard E2E
  e2e-dashboard:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build embedded dashboard assets
        working-directory: web
        run: npm run build:embed

      - name: Build E2E binary
        run: |
          mkdir -p .tmp
          CGO_ENABLED=0 go build -o .tmp/anubis-e2e ./cmd/anubis

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run dashboard smoke E2E
        working-directory: web
        run: npm run e2e

  # Lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './web/node_modules/*' -not -path './internal/dashboard/node_modules/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

  # Script Validation
  script-validation:
    name: Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Verify production script help output
        run: |
          ./scripts/production-preflight.sh --help >/tmp/anubis-preflight-help.txt
          ./scripts/production-smoke.sh --help >/tmp/anubis-smoke-help.txt
          ./scripts/capture-deployment-evidence.sh --help >/tmp/anubis-evidence-help.txt
          test -s /tmp/anubis-preflight-help.txt
          test -s /tmp/anubis-smoke-help.txt
          test -s /tmp/anubis-evidence-help.txt

      - name: Exercise deployment evidence dry run
        run: |
          rm -rf /tmp/anubis-evidence-ci
          ANUBIS_EVIDENCE_VALUES=deploy/helm/anubiswatch/values.yaml \
            ./scripts/capture-deployment-evidence.sh /tmp/anubis-evidence-ci
          test -s /tmp/anubis-evidence-ci/metadata.env
          test -s /tmp/anubis-evidence-ci/values.sha256
          test -s /tmp/anubis-evidence-ci/README.md

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-backend, lint, script-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build embedded dashboard assets
        working-directory: web
        run: npm ci && npm run build:embed

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o anubis ./cmd/anubis

      - name: Test binary
        run: |
          mkdir -p /tmp/anubis-data
          ./anubis version
          ANUBIS_DATA_DIR=/tmp/anubis-data ./anubis init
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: anubis-linux-amd64
          path: anubis
          retention-days: 1

      - name: Build Docker image
        run: |
          docker build -t anubiswatch/anubis:${{ github.sha }} -f Dockerfile .
          docker save anubiswatch/anubis:${{ github.sha }} > anubis-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: anubis-docker-image
          path: anubis-image.tar
          retention-days: 1

  # Chaos Tests
  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run chaos tests
        run: go test -v -run TestChaos_ ./internal/raft/...
        timeout-minutes: 10

  # Load Tests
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run load tests
        run: go test -v -run TestLoad_ ./internal/probe/...
        timeout-minutes: 15

  # Benchmarks
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./internal/... 2>&1 | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.txt

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: anubis-linux-amd64

      - name: Make executable
        run: chmod +x anubis

      - name: Start server
        run: |
          mkdir -p /tmp/anubis-data
          ./anubis init
          ./anubis serve --single &
          sleep 5
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data
          ANUBIS_CONFIG: /tmp/anubis-test.json

      - name: Run integration tests
        run: go test -v -tags=integration ./internal/api/... ./internal/probe/...
        env:
          ANUBIS_TEST_ENDPOINT: http://localhost:8080

      - name: Stop server
        if: always()
        run: pkill anubis || true

  helm-tests:
    name: Helm Chart Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.4'

      - name: Lint Helm charts
        run: |
          helm lint deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!'
          helm lint deployments/charts/anubiswatch \
            --set secrets.adminPassword='StrongPass123!'

      - name: Template Helm charts
        run: |
          helm template anubiswatch deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            > helm-deploy.yaml
          helm template anubiswatch-cluster deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            --set config.necropolis.enabled=true \
            --set secrets.clusterSecret='ClusterSecret123!' \
            > helm-deploy-cluster.yaml
          helm template anubiswatch deployments/charts/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            > helm-deployments.yaml
          helm template anubiswatch-cluster deployments/charts/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            --set config.necropolis.enabled=true \
            --set secrets.clusterSecret='ClusterSecret123!' \
            > helm-deployments-cluster.yaml

      - name: Validate rendered Kubernetes manifests
        run: |
          docker run --rm -v "$PWD":/work ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /work/helm-deploy.yaml \
            /work/helm-deploy-cluster.yaml \
            /work/helm-deployments.yaml \
            /work/helm-deployments-cluster.yaml

      - name: Verify Helm secret guardrails
        run: |
          for chart in deploy/helm/anubiswatch deployments/charts/anubiswatch; do
            if helm template anubiswatch "$chart" >/tmp/missing-admin.yaml 2>/tmp/missing-admin.err; then
              echo "Expected $chart to fail without secrets.adminPassword"
              exit 1
            fi
            grep -q "secrets.adminPassword is required" /tmp/missing-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=admin >/tmp/default-admin.yaml 2>/tmp/default-admin.err; then
              echo "Expected $chart to fail with default admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/default-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=CHANGE_ME >/tmp/placeholder-admin.yaml 2>/tmp/placeholder-admin.err; then
              echo "Expected $chart to fail with placeholder admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/placeholder-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=lowercaseonly >/tmp/weak-admin.yaml 2>/tmp/weak-admin.err; then
              echo "Expected $chart to fail with weak admin password"
              exit 1
            fi
            grep -q "must be at least 12 characters" /tmp/weak-admin.err

            if helm template anubiswatch "$chart" \
              --set secrets.adminPassword='StrongPass123!' \
              --set config.necropolis.enabled=true \
              >/tmp/missing-cluster-secret.yaml 2>/tmp/missing-cluster-secret.err; then
              echo "Expected $chart to fail without secrets.clusterSecret in cluster mode"
              exit 1
            fi
            grep -q "secrets.clusterSecret is required" /tmp/missing-cluster-secret.err
          done

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run gosec
        uses: securego/gosec@v2.26.1
        with:
          args: >-
            -exclude=G115,G304,G301,G306,G505,G103,G104,G703,G118,G401,G302,G404,G402,G704,G123
            -exclude-dir=web/node_modules
            -exclude-dir=internal/grpcapi/v1
            -fmt sarif -out gosec.sarif ./...

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  # Docker Security Scan
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: anubis-docker-image

      - name: Load Docker image
        run: docker load < anubis-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anubiswatch/anubis:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

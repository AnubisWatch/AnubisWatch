name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

# Read-only by default; only the two jobs that upload SARIF get
# security-events: write.
permissions:
  contents: read

env:
  GO_VERSION: '1.27.3'
  NODE_VERSION: '22'
  ANUBIS_DATA_DIR: /tmp/anubis
  ANUBIS_CONFIG: /tmp/anubis.json
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Backend Tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      # Hoisted so the Codecov step's `if:` can test it — the secrets context
      # is not available in a step-level condition.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Create test directories
        run: |
          mkdir -p /tmp/anubis-data
          chmod 700 /tmp/anubis-data

      - name: Run tests and enforce coverage threshold
        run: ./scripts/check-go-coverage.sh
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data

      - name: Upload coverage to Codecov
        # Skipped when CODECOV_TOKEN is not configured. The coverage GATE is
        # the check-go-coverage.sh step above; this is reporting on top of it.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-filtered.out
          flags: backend
          fail_ci_if_error: false

  # Frontend Tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      # Hoisted so the Codecov step's `if:` can test it — the secrets context
      # is not available in a step-level condition.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Check API types match the OpenAPI spec
        # src/api/schema.generated.ts is generated from
        # internal/api/openapi.yaml; fails when someone edits the spec without
        # running `pnpm run gen:api` (offline, no network beyond the install).
        working-directory: web
        run: pnpm run check:api

      - name: Run linter
        working-directory: web
        run: pnpm run lint

      - name: Type-check
        working-directory: web
        run: pnpm exec tsc --noEmit

      - name: Run tests and enforce coverage threshold
        working-directory: web
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        # Skipped when CODECOV_TOKEN is not configured. The coverage GATE is
        # the vitest thresholds in the step above; this is reporting on top.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # Dashboard E2E
  e2e-dashboard:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build embedded dashboard assets
        working-directory: web
        run: pnpm run build:embed

      - name: Build E2E binary
        run: |
          mkdir -p .tmp
          CGO_ENABLED=0 go build -o .tmp/anubis-e2e ./cmd/anubis

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dashboard smoke E2E
        working-directory: web
        run: pnpm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-trace-and-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Lint
  # Static analysis gate (K10): gofmt, govet, gosec, govulncheck.
  # All four run on every PR — a finding in any of them blocks
  # the build. Combined into one job to share the Go module
  # cache and to give PR authors a single failure surface.
  static-analysis:
    name: Static Analysis (gofmt/vet/gosec/govulncheck)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      - name: Verify golangci-lint config
        run: '"$(go env GOPATH)/bin/golangci-lint" config verify'

      - name: Run golangci-lint
        run: '"$(go env GOPATH)/bin/golangci-lint" run --timeout=5m'

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './web/node_modules/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      # gosec — fail on severity ≥ medium, confidence ≥ medium.
      # The exclude list mirrors .golangci.yml rationale. We do
      # NOT pass -no-fail, so any new finding breaks the build.
      # We do NOT pass -quiet either — verbose output is part of
      # the audit trail in the CI log.
      - name: Run gosec
        id: gosec
        # Build the pinned scanner with the same Go toolchain as the project.
        # v2.29's parser cannot read Go1.27 export data; a successful SSA scan
        # must not be replaced by a type-error or an empty report.
        run: |
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0 \
            -exclude=G115,G304,G301,G306,G505,G103,G104,G703,G118,G401,G302,G404,G402,G704,G123 \
            -exclude-dir=web/node_modules \
            -exclude-dir=internal/grpcapi/v1 \
            -exclude-dir=.temp_files \
            -exclude-dir=.tmp \
            -exclude-dir=.wrongstack \
            -severity=medium -confidence=medium \
            -fmt sarif -out gosec.sarif ./...

      - name: Assert gosec clean
        # Belt-and-braces: the securego action propagates the
        # exit code, but a future bump in default behaviour could
        # silently weaken the gate. Re-assert explicitly.
        run: |
          if ! grep -q '"level":"error"' gosec.sarif 2>/dev/null; then
            echo "gosec: no high/medium findings — OK"
          else
            echo "gosec: high/medium findings present in SARIF"
            grep -A 1 '"level":"error"' gosec.sarif | head -40
            exit 1
          fi

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        # always(), so a gosec finding still gets reported — but only if the
        # file exists. When an earlier step fails, gosec is skipped and never
        # writes gosec.sarif; uploading unconditionally then adds a second,
        # misleading red step ("Path does not exist") on top of the real one.
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Run govulncheck
        id: vuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          set +e
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee /tmp/vuln.out
          EXIT=$?
          set -e
          echo "govulncheck exit code: $EXIT"
          if [ "$EXIT" -ne 0 ]; then
            echo "govulncheck failed — see step log"
            exit "$EXIT"
          fi

      - name: Assert govulncheck reported a clean scan
        run: |
          if ! grep -Eq '^(No vulnerabilities found\.|Your code is affected by 0 vulnerabilities\.)' /tmp/vuln.out; then
            echo "govulncheck exited successfully without its documented clean-result message"
            cat /tmp/vuln.out
            exit 1
          fi

  # Script Validation
  script-validation:
    name: Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check shell script syntax
        run: |
          bash -n run.sh
          bash scripts/check-shell-syntax.sh
          bash scripts/check-shell-syntax_test.sh

      - name: Test standalone launcher and Compose configuration
        run: |
          bash scripts/launcher_test.sh
          bash scripts/compose_test.sh

      - name: Test Kubernetes drill without a cluster
        run: bash scripts/k8s-drill/k8s-drill_test.sh

      - name: Verify production script help output
        run: |
          ./scripts/production-preflight.sh --help >/tmp/anubis-preflight-help.txt
          ./scripts/production-smoke.sh --help >/tmp/anubis-smoke-help.txt
          ./scripts/capture-deployment-evidence.sh --help >/tmp/anubis-evidence-help.txt
          ./scripts/downloaded-binary-smoke.sh --help >/tmp/anubis-binary-smoke-help.txt
          test -s /tmp/anubis-preflight-help.txt
          test -s /tmp/anubis-smoke-help.txt
          test -s /tmp/anubis-evidence-help.txt
          test -s /tmp/anubis-binary-smoke-help.txt

      - name: Exercise deployment evidence dry run
        run: |
          rm -rf /tmp/anubis-evidence-ci
          ANUBIS_EVIDENCE_CAPTURE_CLUSTER=false \
          ANUBIS_EVIDENCE_VALUES=deploy/helm/anubiswatch/values.yaml \
            ./scripts/capture-deployment-evidence.sh /tmp/anubis-evidence-ci
          test -s /tmp/anubis-evidence-ci/metadata.env
          test -s /tmp/anubis-evidence-ci/values.sha256
          test -s /tmp/anubis-evidence-ci/README.md

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    # K10: static-analysis (gofmt/vet/gosec/govulncheck) is the
    # primary gate — any new gosec finding or CVE breaks the
    # build before we spend minutes on chaos/load/integration
    # suites. The job was renamed from `lint` and now bundles
    # security; see K10 notes in the static-analysis job below.
    needs: [test-backend, static-analysis, script-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build embedded dashboard assets
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build:embed

      # `go build`/`go install` from a checkout embeds the committed
      # internal/dashboard/dist, so it must be exactly what web/ builds to
      # (the Vite build is deterministic). Rebuild with `make dashboard` and
      # commit the result when this fails.
      - name: Verify committed dashboard build is current
        run: |
          changes="$(git status --porcelain -- internal/dashboard/dist)"
          if [ -n "$changes" ]; then
            echo "::error::internal/dashboard/dist is stale; run 'make dashboard' and commit it"
            echo "$changes"
            exit 1
          fi

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o anubis ./cmd/anubis

      - name: Test binary
        run: |
          mkdir -p /tmp/anubis-data
          ./anubis version
          ANUBIS_DATA_DIR=/tmp/anubis-data ./anubis init
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anubis-linux-amd64
          path: anubis
          retention-days: 1

      - name: Verify .dockerignore
        # Catches the regression where a future contributor adds
        # a file with secrets (anubis.json, *.pem, secrets/) and
        # forgets to add it to .dockerignore. The script does two
        # things: (1) lint .dockerignore for missing required
        # patterns, (2) build the real Dockerfile and inspect the
        # final image's filesystem for leaks. ~3min on a clean
        # cache; subsequent PRs hit the buildx cache.
        run: ./scripts/check-dockerignore.sh

      - name: Build Docker image
        # Stamped like every other build path, so the image the
        # integration-tests job consumes reports a real version rather than
        # "dev/unknown/unknown".
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t ghcr.io/anubiswatch/anubiswatch:${{ github.sha }} -f Dockerfile .
          docker save ghcr.io/anubiswatch/anubiswatch:${{ github.sha }} > anubis-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: anubis-docker-image
          path: anubis-image.tar
          retention-days: 1

  # Chaos Tests
  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run chaos tests
        run: go test -race -v -run TestChaos_ ./internal/raft/...
        env:
          ANUBIS_RUN_CHAOS_TESTS: "1"
        timeout-minutes: 10

      # The chaos tests skip themselves unless ANUBIS_RUN_CHAOS_TESTS is set,
      # so assert they actually ran to prevent this job from silently becoming
      # a no-op again.
      - name: Verify chaos tests actually ran
        run: |
          OUTPUT=$(ANUBIS_RUN_CHAOS_TESTS=1 go test -run TestChaos_ -v ./internal/raft/... 2>&1)
          PASS_COUNT=$(echo "$OUTPUT" | grep -c -- "--- PASS: TestChaos_" || true)
          echo "Chaos tests passed: $PASS_COUNT"
          if [ "$PASS_COUNT" -lt 6 ]; then
            echo "::error::Expected at least 6 chaos tests to run and pass, got $PASS_COUNT"
            exit 1
          fi

  # Load Tests
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run load tests
        run: |
          set -o pipefail
          go test -count=1 -v -run TestLoad_ ./internal/probe/... | tee /tmp/load-test-output.log
        env:
          ANUBIS_RUN_LOAD_TESTS: "true"
        timeout-minutes: 15

      # The load tests skip themselves unless ANUBIS_RUN_LOAD_TESTS=true, and
      # a subset also skips itself on CI (GitHub Actions always sets CI=true),
      # so assert on the captured output that every discovered TestLoad_
      # actually executed and that only the expected CI skips happened.
      # Scope: this job only runs on push to main, so the guard protects main
      # rather than pull requests.
      - name: Verify load tests actually ran
        run: |
          set -uo pipefail
          DISCOVERED=$(grep -o -- "^func TestLoad_[A-Za-z0-9_]*" internal/probe/load_test.go | sed 's/^func //' | sort || true)
          RAN=$(grep -o -- "^--- \(PASS\|SKIP\): TestLoad_[A-Za-z0-9_]*" /tmp/load-test-output.log | sed 's/^--- \(PASS\|SKIP\): //' | sort -u || true)
          PASS_COUNT=$(grep -c -- "^--- PASS: TestLoad_" /tmp/load-test-output.log || true)
          SKIP_COUNT=$(grep -c -- "^--- SKIP: TestLoad_" /tmp/load-test-output.log || true)
          EXPECTED_CI_SKIPS=$(grep -c -- 'Skip("Skipping load test in CI environment")' internal/probe/load_test.go || true)
          echo "Load tests: discovered=$(printf '%s\n' "$DISCOVERED" | grep -c . || true) passed=$PASS_COUNT skipped=$SKIP_COUNT expected_ci_skips=$EXPECTED_CI_SKIPS"
          MISSING=$(comm -23 <(printf '%s\n' "$DISCOVERED") <(printf '%s\n' "$RAN"))
          if [ -n "$MISSING" ]; then
            echo "::error::Load tests did not run: $MISSING"
            cat /tmp/load-test-output.log
            exit 1
          fi
          if [ "$SKIP_COUNT" -ne "$EXPECTED_CI_SKIPS" ]; then
            echo "::error::Unexpected load test skips: got $SKIP_COUNT, expected $EXPECTED_CI_SKIPS"
            grep -- '^--- SKIP: TestLoad_' /tmp/load-test-output.log || true
            cat /tmp/load-test-output.log
            exit 1
          fi
          if [ "$PASS_COUNT" -lt 1 ]; then
            echo "::error::No load test passed; the load test suite became a no-op"
            cat /tmp/load-test-output.log
            exit 1
          fi

  # Benchmarks
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./internal/... 2>&1 | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-results
          path: benchmark.txt

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: anubis-linux-amd64

      - name: Make executable
        run: chmod +x anubis

      - name: Smoke downloaded binary
        run: ./scripts/downloaded-binary-smoke.sh "$PWD/anubis"

      - name: Run integration tests
        run: go test -v -tags=integration ./internal/api/... ./internal/probe/...

  helm-tests:
    name: Helm Chart Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: '3.14.4'

      - name: Lint Helm charts
        run: |
          helm lint deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!'
          helm lint deploy/helm/anubiswatch \
            -f deploy/helm/anubiswatch/values-production.example.yaml \
            --set secrets.adminPassword='StrongPass123!' \
            --set secrets.encryptionKey='StrongEncryptionKey123!'

      - name: Test Helm topology and rollout guardrails
        run: go test ./deploy/helm/anubiswatch/tests -count=1

      - name: Template Helm charts
        run: |
          helm template anubiswatch deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            > helm-deploy.yaml
          helm template anubiswatch-production-example deploy/helm/anubiswatch \
            -f deploy/helm/anubiswatch/values-production.example.yaml \
            --set secrets.adminPassword='StrongPass123!' \
            --set secrets.encryptionKey='StrongEncryptionKey123!' \
            > helm-deploy-production-example.yaml
          helm template anubiswatch-ha deploy/helm/anubiswatch \
            -f deploy/helm/anubiswatch/values-production.example.yaml \
            -f deploy/helm/anubiswatch/values-ha.example.yaml \
            --set image.tag='${{ github.sha }}' \
            --set secrets.adminPassword='StrongPass123!' \
            --set secrets.encryptionKey='StrongEncryptionKey123!' \
            --set secrets.clusterSecret='StrongClusterSecret123!' \
            --set cluster.raftTLSSecret=anubiswatch-peer-tls \
            > helm-deploy-ha.yaml

      - name: Validate rendered Kubernetes manifests
        run: |
          docker run --rm -v "$PWD":/work ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /work/helm-deploy.yaml \
            /work/helm-deploy-production-example.yaml \
            /work/helm-deploy-ha.yaml

      - name: Verify Helm secret guardrails
        run: |
          for chart in deploy/helm/anubiswatch; do
            if helm template anubiswatch "$chart" >/tmp/missing-admin.yaml 2>/tmp/missing-admin.err; then
              echo "Expected $chart to fail without secrets.adminPassword"
              exit 1
            fi
            grep -q "secrets.adminPassword is required" /tmp/missing-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=admin >/tmp/default-admin.yaml 2>/tmp/default-admin.err; then
              echo "Expected $chart to fail with default admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/default-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=CHANGE_ME >/tmp/placeholder-admin.yaml 2>/tmp/placeholder-admin.err; then
              echo "Expected $chart to fail with placeholder admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/placeholder-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=lowercaseonly >/tmp/weak-admin.yaml 2>/tmp/weak-admin.err; then
              echo "Expected $chart to fail with weak admin password"
              exit 1
            fi
            grep -q "must be at least 12 characters" /tmp/weak-admin.err

            if helm template anubiswatch "$chart" \
              --set secrets.adminPassword='StrongPass123!' \
              --set config.necropolis.enabled=true \
              --set image.tag='reviewed-ha-candidate' \
              --set secrets.clusterSecret='StrongClusterSecret123!' \
              >/tmp/missing-peer-tls.yaml 2>/tmp/missing-peer-tls.err; then
              echo "Expected $chart to reject cluster mode without peer TLS"
              exit 1
            fi
            grep -q "cluster.raftTLSSecret is required" /tmp/missing-peer-tls.err

            if helm template anubiswatch "$chart" \
              --set secrets.adminPassword='StrongPass123!' \
              --set replicaCount=2 \
              >/tmp/unsafe-replicas.yaml 2>/tmp/unsafe-replicas.err; then
              echo "Expected $chart to reject multiple standalone replicas"
              exit 1
            fi
            grep -q "replicaCount must be 1" /tmp/unsafe-replicas.err
          done

  # Docker Security Scan
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Docker image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: anubis-docker-image

      - name: Load Docker image
        run: docker load < anubis-image.tar

      - name: Run blocking Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/anubiswatch/anubiswatch:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Block on findings that HAVE a fix — those are actionable, and this
          # setting still catches them (it is what flagged CVE-2026-14456 in
          # the base image's openssl, now closed by the apk upgrade in the
          # Dockerfile).
          #
          # ignore-unfixed was false, which also blocked on vulnerabilities
          # with no published fix. That made the gate unsatisfiable: it was
          # failing on GO-2026-5932 (x/crypto/openpgp) and CVE-2026-56852
          # (x/text), both transitive, both already at the newest published
          # version of their module, and both reported by govulncheck as not
          # reachable from this code ("affected by 0 vulnerabilities"). No
          # change in this repository could turn that job green. An
          # unsatisfiable gate is noise, and noise is what hid the openssl
          # finding and the Codecov failure for months.
          #
          # Unfixed findings stay visible: the SARIF upload below runs
          # always() and publishes them to the Security tab, and govulncheck
          # remains a hard gate in the static-analysis job with real
          # reachability analysis.
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # Kubernetes Acceptance Drill (next.md P0-B): disposable kind cluster,
  # all eight scenarios, structured evidence. Measured runtime: ~18-20 min
  # wall on a 1 control-plane + 3 worker kind topology (run18, 2026-10-24);
  # the 45-minute job budget and 35-minute drill timeout leave headroom for
  # slower CI runners. Gated to push-to-main like the other long jobs.
  k8s-drill:
    name: Kubernetes Acceptance Drill (kind, 8 scenarios)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: 'v1.31.3'

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: '3.14.4'

      - name: Create disposable kind cluster (1 control-plane + 3 workers)
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: anubis-drill-ci
          config: scripts/k8s-drill/kind-ci.yaml

      - name: Build the image under test
        run: docker build -q -t anubiswatch:ci-drill .

      - name: Load the image into kind
        run: kind load docker-image anubiswatch:ci-drill --name anubis-drill-ci

      - name: Run the acceptance drill (8 scenarios)
        run: |
          set -o pipefail
          scripts/k8s-drill/k8s-drill.sh \
            --kubeconfig "$HOME/.kube/config" \
            --context kind-anubis-drill-ci \
            --image anubiswatch:ci-drill \
            --namespace anubiswatch-drill \
            --output-dir "$RUNNER_TEMP/k8s-drill" \
            2>&1 | tee /tmp/k8s-drill-output.log
        timeout-minutes: 35

      # results.json (structured per-scenario evidence with source/image
      # identity) plus the raw drill log. The disposable drill CA and
      # per-run credentials stay in the (ephemeral) state directory and are
      # deliberately not uploaded.
      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: k8s-drill-results
          path: |
            ${{ runner.temp }}/k8s-drill/results.json
            /tmp/k8s-drill-output.log
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  GO_VERSION: '1.26.4'
  NODE_VERSION: '22'
  ANUBIS_DATA_DIR: /tmp/anubis
  ANUBIS_CONFIG: /tmp/anubis.json
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Backend Tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Create test directories
        run: |
          mkdir -p /tmp/anubis-data
          chmod 700 /tmp/anubis-data

      - name: Run tests with coverage and race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data
          ANUBIS_CONFIG: /tmp/anubis-test.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          flags: backend
          fail_ci_if_error: false

      - name: Check coverage threshold (excluding generated code)
        run: |
          # Exclude generated protobuf code from coverage calculation
          grep -v "internal/grpcapi/v1/" coverage.out > coverage-filtered.out || true
          COVERAGE=$(go tool cover -func=coverage-filtered.out | grep total | awk '{print $3}' | sed 's/%//' | cut -d. -f1)
          echo "Total coverage (excluding generated): $COVERAGE%"
          if [ "$COVERAGE" -lt 75 ]; then
            echo "Coverage $COVERAGE% is below threshold 75%"
            exit 1
          fi

  # Frontend Tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: web
        run: pnpm run lint

      - name: Run tests
        working-directory: web
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./web/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  # Dashboard E2E
  e2e-dashboard:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build embedded dashboard assets
        working-directory: web
        run: pnpm run build:embed

      - name: Build E2E binary
        run: |
          mkdir -p .tmp
          CGO_ENABLED=0 go build -o .tmp/anubis-e2e ./cmd/anubis

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dashboard smoke E2E
        working-directory: web
        run: pnpm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace-and-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Lint
  # Static analysis gate (K10): gofmt, govet, gosec, govulncheck.
  # All four run on every PR — a finding in any of them blocks
  # the build. Combined into one job to share the Go module
  # cache and to give PR authors a single failure surface.
  static-analysis:
    name: Static Analysis (gofmt/vet/gosec/govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      # golangci-lint config sanity — catches YAML drift and
      # references to linters/options that don't exist in the
      # pinned version. Fast (~1s) and runs before any linter
      # work would, so a bad config fails the job with a clear
      # "unknown linter" message instead of a half-broken lint
      # run. The full `golangci-lint run` is not gated here
      # (add it as a separate job if/when the team wants it).
      - name: Verify golangci-lint config
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2
          args: config verify
          only-new-issues: false

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './web/node_modules/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      # gosec — fail on severity ≥ medium, confidence ≥ medium.
      # The exclude list mirrors .golangci.yml rationale. We do
      # NOT pass -no-fail, so any new finding breaks the build.
      # We do NOT pass -quiet either — verbose output is part of
      # the audit trail in the CI log.
      - name: Run gosec
        id: gosec
        uses: securego/gosec@v2.26.1
        with:
          args: >-
            -exclude=G115,G304,G301,G306,G505,G103,G104,G703,G118,G401,G302,G404,G402,G704,G123
            -exclude-dir=web/node_modules
            -exclude-dir=internal/grpcapi/v1
            -severity=medium
            -confidence=medium
            -fmt sarif -out gosec.sarif ./...

      - name: Assert gosec clean
        # Belt-and-braces: the securego action propagates the
        # exit code, but a future bump in default behaviour could
        # silently weaken the gate. Re-assert explicitly.
        run: |
          if ! grep -q '"level":"error"' gosec.sarif 2>/dev/null; then
            echo "gosec: no high/medium findings — OK"
          else
            echo "gosec: high/medium findings present in SARIF"
            grep -A 1 '"level":"error"' gosec.sarif | head -40
            exit 1
          fi

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gosec.sarif

      # govulncheck — exit 1 on any CVE in our call graph. We
      # install at the same Go version the test matrix uses, so
      # the vuln DB matches. The output grep below is the gating
      # check; govulncheck's own exit code is a backstop.
      - name: Run govulncheck
        id: vuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          # set +e so we can inspect the output even on non-zero exit
          set +e
          "$(go env GOPATH)/bin/govulncheck" ./... | tee /tmp/vuln.out
          EXIT=$?
          set -e
          echo "govulncheck exit code: $EXIT"
          echo "----- summary -----"
          grep -E "Your code is affected by ([0-9]+) vulnerabilities" /tmp/vuln.out || echo "summary line not found"
          if [ $EXIT -ne 0 ]; then
            echo "govulncheck failed — see step log"
            exit $EXIT
          fi

      - name: Assert govulncheck count is zero
        # Belt-and-braces: the govulncheck exit code already gates
        # this job, but the explicit grep catches any future tool
        # release that changes the exit-code semantics (e.g. adds
        # warnings without changing the code).
        run: |
          COUNT=$(grep -oE "Your code is affected by [0-9]+ vulnerabilities" /tmp/vuln.out | grep -oE "[0-9]+" || echo "?")
          if [ -z "$COUNT" ] || [ "$COUNT" != "0" ]; then
            echo "govulncheck reported $COUNT vulnerability class(es) — see step log"
            exit 1
          fi

  # Script Validation
  script-validation:
    name: Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Verify production script help output
        run: |
          ./scripts/production-preflight.sh --help >/tmp/anubis-preflight-help.txt
          ./scripts/production-smoke.sh --help >/tmp/anubis-smoke-help.txt
          ./scripts/capture-deployment-evidence.sh --help >/tmp/anubis-evidence-help.txt
          test -s /tmp/anubis-preflight-help.txt
          test -s /tmp/anubis-smoke-help.txt
          test -s /tmp/anubis-evidence-help.txt

      - name: Exercise deployment evidence dry run
        run: |
          rm -rf /tmp/anubis-evidence-ci
          ANUBIS_EVIDENCE_VALUES=deploy/helm/anubiswatch/values.yaml \
            ./scripts/capture-deployment-evidence.sh /tmp/anubis-evidence-ci
          test -s /tmp/anubis-evidence-ci/metadata.env
          test -s /tmp/anubis-evidence-ci/values.sha256
          test -s /tmp/anubis-evidence-ci/README.md

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    # K10: static-analysis (gofmt/vet/gosec/govulncheck) is the
    # primary gate — any new gosec finding or CVE breaks the
    # build before we spend minutes on chaos/load/integration
    # suites. The job was renamed from `lint` and now bundles
    # security; see K10 notes in the static-analysis job below.
    needs: [test-backend, static-analysis, script-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build embedded dashboard assets
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build:embed

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o anubis ./cmd/anubis

      - name: Test binary
        run: |
          mkdir -p /tmp/anubis-data
          ./anubis version
          ANUBIS_DATA_DIR=/tmp/anubis-data ./anubis init
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: anubis-linux-amd64
          path: anubis
          retention-days: 1

      - name: Verify .dockerignore
        # Catches the regression where a future contributor adds
        # a file with secrets (anubis.json, *.pem, secrets/) and
        # forgets to add it to .dockerignore. The script does two
        # things: (1) lint .dockerignore for missing required
        # patterns, (2) build the real Dockerfile and inspect the
        # final image's filesystem for leaks. ~3min on a clean
        # cache; subsequent PRs hit the buildx cache.
        run: ./scripts/check-dockerignore.sh

      - name: Build Docker image
        run: |
          docker build -t anubiswatch/anubis:${{ github.sha }} -f Dockerfile .
          docker save anubiswatch/anubis:${{ github.sha }} > anubis-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: anubis-docker-image
          path: anubis-image.tar
          retention-days: 1

  # Chaos Tests
  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run chaos tests
        run: go test -v -run TestChaos_ ./internal/raft/...
        timeout-minutes: 10

  # Load Tests
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run load tests
        run: go test -v -run TestLoad_ ./internal/probe/...
        timeout-minutes: 15

  # Benchmarks
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./internal/... 2>&1 | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.txt

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: anubis-linux-amd64

      - name: Make executable
        run: chmod +x anubis

      - name: Start server
        run: |
          mkdir -p /tmp/anubis-data
          ./anubis init
          ./anubis serve --single &
          sleep 5
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data
          ANUBIS_CONFIG: /tmp/anubis-test.json

      - name: Run integration tests
        run: go test -v -tags=integration ./internal/api/... ./internal/probe/...
        env:
          ANUBIS_TEST_ENDPOINT: http://localhost:8080

      - name: Stop server
        if: always()
        run: pkill anubis || true

  helm-tests:
    name: Helm Chart Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.4'

      - name: Lint Helm charts
        run: |
          helm lint deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!'
          helm lint deploy/helm/anubiswatch \
            -f deploy/helm/anubiswatch/values-production.example.yaml \
            --set secrets.adminPassword='StrongPass123!' \
            --set secrets.clusterSecret='ClusterSecret123!'

      - name: Template Helm charts
        run: |
          helm template anubiswatch deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            > helm-deploy.yaml
          helm template anubiswatch-cluster deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            --set config.necropolis.enabled=true \
            --set secrets.clusterSecret='ClusterSecret123!' \
            > helm-deploy-cluster.yaml
          helm template anubiswatch-production-example deploy/helm/anubiswatch \
            -f deploy/helm/anubiswatch/values-production.example.yaml \
            --set secrets.adminPassword='StrongPass123!' \
            --set secrets.clusterSecret='ClusterSecret123!' \
            > helm-deploy-production-example.yaml

      - name: Validate rendered Kubernetes manifests
        run: |
          docker run --rm -v "$PWD":/work ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /work/helm-deploy.yaml \
            /work/helm-deploy-cluster.yaml \
            /work/helm-deploy-production-example.yaml

      - name: Verify Helm secret guardrails
        run: |
          for chart in deploy/helm/anubiswatch; do
            if helm template anubiswatch "$chart" >/tmp/missing-admin.yaml 2>/tmp/missing-admin.err; then
              echo "Expected $chart to fail without secrets.adminPassword"
              exit 1
            fi
            grep -q "secrets.adminPassword is required" /tmp/missing-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=admin >/tmp/default-admin.yaml 2>/tmp/default-admin.err; then
              echo "Expected $chart to fail with default admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/default-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=CHANGE_ME >/tmp/placeholder-admin.yaml 2>/tmp/placeholder-admin.err; then
              echo "Expected $chart to fail with placeholder admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/placeholder-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=lowercaseonly >/tmp/weak-admin.yaml 2>/tmp/weak-admin.err; then
              echo "Expected $chart to fail with weak admin password"
              exit 1
            fi
            grep -q "must be at least 12 characters" /tmp/weak-admin.err

            if helm template anubiswatch "$chart" \
              --set secrets.adminPassword='StrongPass123!' \
              --set config.necropolis.enabled=true \
              >/tmp/missing-cluster-secret.yaml 2>/tmp/missing-cluster-secret.err; then
              echo "Expected $chart to fail without secrets.clusterSecret in cluster mode"
              exit 1
            fi
            grep -q "secrets.clusterSecret is required" /tmp/missing-cluster-secret.err
          done

  # Docker Security Scan
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: anubis-docker-image

      - name: Load Docker image
        run: docker load < anubis-image.tar

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anubiswatch/anubis:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

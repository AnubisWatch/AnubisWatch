name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  id-token: write

env:
  GO_VERSION: '1.26.6'
  NODE_VERSION: '22'
  ANUBIS_DATA_DIR: /tmp/anubis
  ANUBIS_CONFIG: /tmp/anubis.json
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # Backend Tests
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      # Hoisted so the Codecov step's `if:` can test it — the secrets context
      # is not available in a step-level condition.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Create test directories
        run: |
          mkdir -p /tmp/anubis-data
          chmod 700 /tmp/anubis-data

      - name: Run tests and enforce coverage threshold
        run: ./scripts/check-go-coverage.sh
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data
          ANUBIS_CONFIG: /tmp/anubis-test.json

      - name: Upload coverage to Codecov
        # Skipped when CODECOV_TOKEN is not configured. The coverage GATE is
        # the check-go-coverage.sh step above; this is reporting on top of it.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-filtered.out
          flags: backend
          fail_ci_if_error: true

  # Frontend Tests
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    env:
      # Hoisted so the Codecov step's `if:` can test it — the secrets context
      # is not available in a step-level condition.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run linter
        working-directory: web
        run: pnpm run lint

      - name: Run tests and enforce coverage threshold
        working-directory: web
        run: pnpm run test:coverage

      - name: Upload coverage to Codecov
        # Skipped when CODECOV_TOKEN is not configured. The coverage GATE is
        # the vitest thresholds in the step above; this is reporting on top.
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: true

  # Dashboard E2E
  e2e-dashboard:
    name: Dashboard E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build embedded dashboard assets
        working-directory: web
        run: pnpm run build:embed

      - name: Build E2E binary
        run: |
          mkdir -p .tmp
          CGO_ENABLED=0 go build -o .tmp/anubis-e2e ./cmd/anubis

      - name: Install Playwright browsers
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dashboard smoke E2E
        working-directory: web
        run: pnpm run e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace-and-results
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Lint
  # Static analysis gate (K10): gofmt, govet, gosec, govulncheck.
  # All four run on every PR — a finding in any of them blocks
  # the build. Combined into one job to share the Go module
  # cache and to give PR authors a single failure surface.
  static-analysis:
    name: Static Analysis (gofmt/vet/gosec/govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Migrate and verify golangci-lint config
        run: |
          cp .golangci.yml /tmp/golangci.yml
          "$(go env GOPATH)/bin/golangci-lint" migrate \
            --skip-validation \
            --config /tmp/golangci.yml
          # v2's migrator preserves this removed legacy linter in `disable`.
          sed -i '/^[[:space:]]*disable:$/,+1d' /tmp/golangci.yml
          "$(go env GOPATH)/bin/golangci-lint" config verify \
            --config /tmp/golangci.yml

      - name: Run golangci-lint
        run: |
          "$(go env GOPATH)/bin/golangci-lint" run \
            --config /tmp/golangci.yml \
            --timeout=5m

      - name: Run go vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          UNFORMATTED=$(gofmt -l $(find . -name '*.go' -not -path './web/node_modules/*'))
          if [ -n "$UNFORMATTED" ]; then
            echo "Go files need formatting:"
            echo "$UNFORMATTED"
            exit 1
          fi

      # gosec — fail on severity ≥ medium, confidence ≥ medium.
      # The exclude list mirrors .golangci.yml rationale. We do
      # NOT pass -no-fail, so any new finding breaks the build.
      # We do NOT pass -quiet either — verbose output is part of
      # the audit trail in the CI log.
      - name: Run gosec
        id: gosec
        uses: securego/gosec@v2.26.1
        with:
          args: >-
            -exclude=G115,G304,G301,G306,G505,G103,G104,G703,G118,G401,G302,G404,G402,G704,G123
            -exclude-dir=web/node_modules
            -exclude-dir=internal/grpcapi/v1
            -severity=medium
            -confidence=medium
            -fmt sarif -out gosec.sarif ./...

      - name: Assert gosec clean
        # Belt-and-braces: the securego action propagates the
        # exit code, but a future bump in default behaviour could
        # silently weaken the gate. Re-assert explicitly.
        run: |
          if ! grep -q '"level":"error"' gosec.sarif 2>/dev/null; then
            echo "gosec: no high/medium findings — OK"
          else
            echo "gosec: high/medium findings present in SARIF"
            grep -A 1 '"level":"error"' gosec.sarif | head -40
            exit 1
          fi

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        # always(), so a gosec finding still gets reported — but only if the
        # file exists. When an earlier step fails, gosec is skipped and never
        # writes gosec.sarif; uploading unconditionally then adds a second,
        # misleading red step ("Path does not exist") on top of the real one.
        if: always() && hashFiles('gosec.sarif') != ''
        with:
          sarif_file: gosec.sarif

      - name: Run govulncheck
        id: vuln
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          set +e
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee /tmp/vuln.out
          EXIT=$?
          set -e
          echo "govulncheck exit code: $EXIT"
          if [ "$EXIT" -ne 0 ]; then
            echo "govulncheck failed — see step log"
            exit "$EXIT"
          fi

      - name: Assert govulncheck reported a clean scan
        run: |
          if ! grep -Eq '^(No vulnerabilities found\.|Your code is affected by 0 vulnerabilities\.)' /tmp/vuln.out; then
            echo "govulncheck exited successfully without its documented clean-result message"
            cat /tmp/vuln.out
            exit 1
          fi

  # Script Validation
  script-validation:
    name: Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check shell script syntax
        run: bash -n scripts/*.sh

      - name: Verify production script help output
        run: |
          ./scripts/production-preflight.sh --help >/tmp/anubis-preflight-help.txt
          ./scripts/production-smoke.sh --help >/tmp/anubis-smoke-help.txt
          ./scripts/capture-deployment-evidence.sh --help >/tmp/anubis-evidence-help.txt
          ./scripts/downloaded-binary-smoke.sh --help >/tmp/anubis-binary-smoke-help.txt
          test -s /tmp/anubis-preflight-help.txt
          test -s /tmp/anubis-smoke-help.txt
          test -s /tmp/anubis-evidence-help.txt
          test -s /tmp/anubis-binary-smoke-help.txt

      - name: Exercise deployment evidence dry run
        run: |
          rm -rf /tmp/anubis-evidence-ci
          ANUBIS_EVIDENCE_CAPTURE_CLUSTER=false \
          ANUBIS_EVIDENCE_VALUES=deploy/helm/anubiswatch/values.yaml \
            ./scripts/capture-deployment-evidence.sh /tmp/anubis-evidence-ci
          test -s /tmp/anubis-evidence-ci/metadata.env
          test -s /tmp/anubis-evidence-ci/values.sha256
          test -s /tmp/anubis-evidence-ci/README.md

  # Build
  build:
    name: Build
    runs-on: ubuntu-latest
    # K10: static-analysis (gofmt/vet/gosec/govulncheck) is the
    # primary gate — any new gosec finding or CVE breaks the
    # build before we spend minutes on chaos/load/integration
    # suites. The job was renamed from `lint` and now bundles
    # security; see K10 notes in the static-analysis job below.
    needs: [test-backend, static-analysis, script-validation]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build embedded dashboard assets
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm run build:embed

      - name: Build binary
        run: CGO_ENABLED=0 go build -ldflags "-s -w -X main.Version=${{ github.sha }}" -o anubis ./cmd/anubis

      - name: Test binary
        run: |
          mkdir -p /tmp/anubis-data
          ./anubis version
          ANUBIS_DATA_DIR=/tmp/anubis-data ./anubis init
        env:
          ANUBIS_DATA_DIR: /tmp/anubis-data

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: anubis-linux-amd64
          path: anubis
          retention-days: 1

      - name: Verify .dockerignore
        # Catches the regression where a future contributor adds
        # a file with secrets (anubis.json, *.pem, secrets/) and
        # forgets to add it to .dockerignore. The script does two
        # things: (1) lint .dockerignore for missing required
        # patterns, (2) build the real Dockerfile and inspect the
        # final image's filesystem for leaks. ~3min on a clean
        # cache; subsequent PRs hit the buildx cache.
        run: ./scripts/check-dockerignore.sh

      - name: Build Docker image
        # Stamped like every other build path, so the image the
        # integration-tests job consumes reports a real version rather than
        # "dev/unknown/unknown".
        run: |
          docker build \
            --build-arg VERSION=${{ github.sha }} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t anubiswatch/anubis:${{ github.sha }} -f Dockerfile .
          docker save anubiswatch/anubis:${{ github.sha }} > anubis-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: anubis-docker-image
          path: anubis-image.tar
          retention-days: 1

  # Chaos Tests
  chaos-tests:
    name: Chaos Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run chaos tests
        run: go test -race -v -run TestChaos_ ./internal/raft/...
        env:
          ANUBIS_RUN_CHAOS_TESTS: "1"
        timeout-minutes: 10

      # The chaos tests skip themselves unless ANUBIS_RUN_CHAOS_TESTS is set,
      # so assert they actually ran to prevent this job from silently becoming
      # a no-op again.
      - name: Verify chaos tests actually ran
        run: |
          OUTPUT=$(ANUBIS_RUN_CHAOS_TESTS=1 go test -run TestChaos_ -v ./internal/raft/... 2>&1)
          PASS_COUNT=$(echo "$OUTPUT" | grep -c -- "--- PASS: TestChaos_" || true)
          echo "Chaos tests passed: $PASS_COUNT"
          if [ "$PASS_COUNT" -lt 6 ]; then
            echo "::error::Expected at least 6 chaos tests to run and pass, got $PASS_COUNT"
            exit 1
          fi

  # Load Tests
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run load tests
        run: go test -v -run TestLoad_ ./internal/probe/...
        timeout-minutes: 15

  # Benchmarks
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run benchmarks
        run: go test -bench=. -benchmem ./internal/... 2>&1 | tee benchmark.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark.txt

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: anubis-linux-amd64

      - name: Make executable
        run: chmod +x anubis

      - name: Smoke downloaded binary
        run: ./scripts/downloaded-binary-smoke.sh "$PWD/anubis"

      - name: Run integration tests
        run: go test -v -tags=integration ./internal/api/... ./internal/probe/...

  helm-tests:
    name: Helm Chart Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.4'

      - name: Lint Helm charts
        run: |
          helm lint deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!'
          helm lint deploy/helm/anubiswatch \
            -f deploy/helm/anubiswatch/values-production.example.yaml \
            --set secrets.adminPassword='StrongPass123!' \
            --set secrets.encryptionKey='StrongEncryptionKey123!'

      - name: Template Helm charts
        run: |
          helm template anubiswatch deploy/helm/anubiswatch \
            --set secrets.adminPassword='StrongPass123!' \
            > helm-deploy.yaml
          helm template anubiswatch-production-example deploy/helm/anubiswatch \
            -f deploy/helm/anubiswatch/values-production.example.yaml \
            --set secrets.adminPassword='StrongPass123!' \
            --set secrets.encryptionKey='StrongEncryptionKey123!' \
            > helm-deploy-production-example.yaml

      - name: Validate rendered Kubernetes manifests
        run: |
          docker run --rm -v "$PWD":/work ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /work/helm-deploy.yaml \
            /work/helm-deploy-production-example.yaml

      - name: Verify Helm secret guardrails
        run: |
          for chart in deploy/helm/anubiswatch; do
            if helm template anubiswatch "$chart" >/tmp/missing-admin.yaml 2>/tmp/missing-admin.err; then
              echo "Expected $chart to fail without secrets.adminPassword"
              exit 1
            fi
            grep -q "secrets.adminPassword is required" /tmp/missing-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=admin >/tmp/default-admin.yaml 2>/tmp/default-admin.err; then
              echo "Expected $chart to fail with default admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/default-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=CHANGE_ME >/tmp/placeholder-admin.yaml 2>/tmp/placeholder-admin.err; then
              echo "Expected $chart to fail with placeholder admin password"
              exit 1
            fi
            grep -q "must not be a default or placeholder value" /tmp/placeholder-admin.err

            if helm template anubiswatch "$chart" --set secrets.adminPassword=lowercaseonly >/tmp/weak-admin.yaml 2>/tmp/weak-admin.err; then
              echo "Expected $chart to fail with weak admin password"
              exit 1
            fi
            grep -q "must be at least 12 characters" /tmp/weak-admin.err

            if helm template anubiswatch "$chart" \
              --set secrets.adminPassword='StrongPass123!' \
              --set config.necropolis.enabled=true \
              --set secrets.clusterSecret='StrongClusterSecret123!' \
              >/tmp/unsupported-cluster.yaml 2>/tmp/unsupported-cluster.err; then
              echo "Expected $chart to reject unsupported cluster topology"
              exit 1
            fi
            grep -q "config.necropolis.enabled is not supported by this production chart" /tmp/unsupported-cluster.err

            if helm template anubiswatch "$chart" \
              --set secrets.adminPassword='StrongPass123!' \
              --set replicaCount=2 \
              >/tmp/unsafe-replicas.yaml 2>/tmp/unsafe-replicas.err; then
              echo "Expected $chart to reject multiple standalone replicas"
              exit 1
            fi
            grep -q "replicaCount must be 1" /tmp/unsafe-replicas.err
          done

  # Docker Security Scan
  docker-security:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Docker image
        uses: actions/download-artifact@v8
        with:
          name: anubis-docker-image

      - name: Load Docker image
        run: docker load < anubis-image.tar

      - name: Run blocking Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anubiswatch/anubis:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: false
          exit-code: '1'

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

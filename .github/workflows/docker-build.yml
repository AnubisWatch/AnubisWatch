name: Build and Push Container

on:
  # PRs build and scan without publishing. Main images are published only after
  # the canonical CI workflow has completed successfully for that exact commit.
  pull_request:
    branches:
      - main
  workflow_run:
    workflows: [CI]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anubiswatch/anubiswatch
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=raw,value=sha-${{ env.SOURCE_SHA }},enable=${{ github.event_name == 'workflow_run' }}

      # One timestamp shared by the scan candidate and the published image, so
      # the bytes Trivy scanned are the bytes that get pushed.
      - name: Compute build stamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Build one native-platform candidate locally so Trivy can block before
      # any registry mutation. The multi-platform image is published only after
      # this scan succeeds.
      - name: Build scan candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: anubiswatch-scan:${{ env.SOURCE_SHA }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run blocking Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: anubiswatch-scan:${{ env.SOURCE_SHA }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

      - name: Upload Trivy scan results
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Publish multi-platform image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ env.SOURCE_SHA }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

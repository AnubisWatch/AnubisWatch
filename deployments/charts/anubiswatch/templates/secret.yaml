apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anubiswatch.fullname" . }}-secrets
  labels:
    {{- include "anubiswatch.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $adminPassword := required "secrets.adminPassword is required. Set it to a strong password with at least 12 characters, uppercase, lowercase, digit, and symbol." .Values.secrets.adminPassword -}}
  {{- $normalizedAdminPassword := $adminPassword | lower | replace "_" "" | replace "-" "" | replace " " "" -}}
  {{- if or (eq $normalizedAdminPassword "admin") (eq $normalizedAdminPassword "password") (eq $normalizedAdminPassword "changeme") -}}
  {{- fail "secrets.adminPassword must not be a default or placeholder value" -}}
  {{- end }}
  {{- $classes := 0 -}}
  {{- if regexMatch "[A-Z]" $adminPassword -}}{{- $classes = add $classes 1 -}}{{- end -}}
  {{- if regexMatch "[a-z]" $adminPassword -}}{{- $classes = add $classes 1 -}}{{- end -}}
  {{- if regexMatch "[0-9]" $adminPassword -}}{{- $classes = add $classes 1 -}}{{- end -}}
  {{- if regexMatch "[^A-Za-z0-9]" $adminPassword -}}{{- $classes = add $classes 1 -}}{{- end -}}
  {{- if or (lt (len $adminPassword) 12) (lt $classes 3) -}}
  {{- fail "secrets.adminPassword must be at least 12 characters and contain at least 3 of: uppercase, lowercase, digits, special characters" -}}
  {{- end }}
  admin-password: {{ $adminPassword | quote }}
  {{- if .Values.secrets.encryptionKey }}
  encryption-key: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}
  {{- if and .Values.config.necropolis.enabled (not .Values.secrets.clusterSecret) -}}
  {{- fail "secrets.clusterSecret is required when config.necropolis.enabled=true" -}}
  {{- end }}
  {{- if .Values.secrets.clusterSecret }}
  cluster-secret: {{ .Values.secrets.clusterSecret | quote }}
  {{- end }}

      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Judgments
      summary: Soul uptime summary
      description: >-
        Uptime over the last 24 hours, 7 days and 30 days, plus a series of
        equal buckets over the requested range: 5-minute buckets for 1h,
        hourly for 24h, calendar days for 7d, 30d, 90d and 1y. Only alive results count
        as up. uptime_percent is null for a period with no checks.
      parameters:
      - name: range
        in: query
        description: Period the series covers.
        schema:
          type: string
          enum: [1h, 24h, 7d, 30d, 90d, 1y]
          default: 7d
      - name: tz_offset_minutes
        in: query
        description: Caller's offset from UTC in minutes (east positive), used to align buckets. Defaults to 0.
        schema:
          type: integer
          minimum: -840
          maximum: 840
      responses:
        '200':
          description: Uptime summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SoulUptime'
        '400':
          description: Invalid range or tz_offset_minutes
        '403':
          description: Soul belongs to another workspace
        '404':
          description: Soul not found
  /api/v1/souls/{id}/judgments/export:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Reports
      summary: Export a soul's judgments
      description: >-
        Streams the soul's judgments in [from, to), oldest first, as CSV or
        NDJSON, without loading the period into memory. The period is clipped
        to raw-judgment retention (X-Export-Clipped). At most `limit` rows are
        sent; the X-Export-Truncated trailer is true when more remained, so a
        client continues from the last timestamp. Text cells of the CSV that
        start with = + - @ (or tab / carriage return) are prefixed with a
        single quote to stop spreadsheet formula injection. Requires
        judgments:read; a soul of another workspace answers 404. Each
        buffered write (32 KiB) must reach the client within 30 seconds and
        a whole export within 15 minutes, or the stream is cut off.
      parameters:
      - $ref: '#/components/parameters/ReportFrom'
      - $ref: '#/components/parameters/ReportTo'
      - name: format
        in: query
        schema:
          type: string
          enum: [csv, ndjson]
          default: csv
      - name: limit
        in: query
        description: Maximum rows to send.
        schema:
          type: integer
          minimum: 1
          maximum: 1000000
          default: 100000
      responses:
        '200':
          description: The export, as an attachment (Content-Disposition).
          headers:
            X-Export-From:
              schema:
                type: string
                format: date-time
            X-Export-To:
              schema:
                type: string
                format: date-time
            X-Export-Clipped:
              schema:
                type: boolean
          content:
            text/csv:
              schema:
                type: string
                description: >-
                  Header row timestamp,id,soul_id,status,duration_ms,status_code,region,jackal_id,message.
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/JudgmentExportRecord'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: The role lacks judgments:read
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          description: >-
            Too many exports running (at most 2 per user and 8 per server);
            retry after Retry-After seconds.
  /api/v1/reports/sla:
    get:
      tags:
      - Reports
      summary: SLA report
      description: >-
        Availability, failed checks, estimated downtime, incidents and MTTR,
        latency percentiles and (with `target`) the error budget, per soul of
        the workspace and in total, over [from, to). Whole UTC hours and days
        are read from the time-series rollups, so long periods never scan raw
        judgments; raw judgments fill only partial hours and time before
        rollups began. Enabled maintenance windows that apply to a soul are
        excluded time, and embalmed results are ignored. A period older than
        what retention keeps is clipped (clipped=true, retention_horizon).
        Requires judgments:read.
      parameters:
      - $ref: '#/components/parameters/ReportFrom'
      - $ref: '#/components/parameters/ReportTo'
      - $ref: '#/components/parameters/ReportSoulID'
      - $ref: '#/components/parameters/ReportTarget'
      responses:
        '200':
          description: SLA report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SLAResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: The role lacks judgments:read
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          description: The report exceeded its 60-second time budget; pick a shorter period or one soul.
  /api/v1/reports/sla.csv:
    get:
      tags:
      - Reports
      summary: SLA report as CSV
      description: >-
        The SLA report as a CSV attachment: one row per soul, then a total row
        with an empty soul_id and soul_name "(total)". Text cells are
        protected against formula injection as in the judgment export.
      parameters:
      - $ref: '#/components/parameters/ReportFrom'
      - $ref: '#/components/parameters/ReportTo'
      - $ref: '#/components/parameters/ReportSoulID'
      - $ref: '#/components/parameters/ReportTarget'
      responses:

              type: integer
            width:
              type: integer
              minimum: 1
              maximum: 12
            height:
              type: integer
        query:
          $ref: '#/components/schemas/WidgetQuery'
        thresholds:
          type: array
          items:
            type: object
            required: [value, color, op]
            properties:
              value:
                type: number
              color:
                type: string
              op:
                type: string
    WidgetQuery:
      type: object
      required:
      - source
      properties:
        source:
          type: string
          enum:
          - souls
          - judgments
          - stats
          - alerts
        metric:
          type: string
          description: For souls, one of count, list, status_distribution.
        filters:
          type: object
          description: For example soul_id.
          additionalProperties:
            type: string
        time_range:
          type: string
          description: Number with an h, d or w suffix, such as 24h or 7d.
        aggregation:
          type: string
    Workspace:
      type: object
      required: [id, name, slug, description, owner_id, status, created_at, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        owner_id:
          type: string
        settings:
          type: object
          additionalProperties: true
        quotas:
          type: object
          additionalProperties: true
        features:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [active, suspended, trial, deleted]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
    WorkspaceInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        slug:
          type: string
          description: >-
            Create only; derived from name when omitted. Reserved slugs are
            rejected. Ignored on update.
        description:
          type: string
        settings:
          type: object
          properties:
            timezone:
              type: string
            date_format:
              type: string
            status_page_theme:
              type: string
            branding:
              type: object
              properties:
                logo_url:
                  type: string
                favicon_url:
                  type: string
                primary_color:
                  type: string
                accent_color:
                  type: string
                custom_css:
                  type: string
                hide_powered_by:
                  type: boolean
            notifications:
              type: object
              properties:
                digest_enabled:
                  type: boolean
                digest_frequency:
                  type: string
                  enum:
                  - hourly
                  - daily
                  - weekly
                alert_threshold:
                  type: integer
                excluded_channels:
                  type: array
                  items:
                    type: string
    MCPRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          description: Request ID (string or number), echoed in the response.
        method:
          type: string
          enum:
          - initialize
          - tools/list
          - tools/call
          - resources/list
          - resources/read
          - prompts/list
          - prompts/get
        params:
          type: object
    PaginatedSouls:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Soul'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required: [total, offset, limit, has_more]
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        next_offset:
          type: integer
    QuotaCounter:
      type: object
      required: [used, limit]
      properties:
        used:
          type: integer
        limit:
          type: integer
          description: 0 means unlimited
    QuotaUsage:
      type: object
      required: [workspace, enforced, souls, journeys, alert_channels, team_members, check_interval_min, retention_days]
      properties:
        workspace:
          type: string
        enforced:
          type: boolean
          description: Whether tenants.enabled is on, so the limits apply
        souls:
          $ref: '#/components/schemas/QuotaCounter'
        journeys:
          $ref: '#/components/schemas/QuotaCounter'
        alert_channels:
          $ref: '#/components/schemas/QuotaCounter'
        team_members:
          $ref: '#/components/schemas/QuotaCounter'
        check_interval_min:
          type: string
          description: Shortest allowed check interval ("0s" means no floor)
          example: 30s
        retention_days:
          type: integer
          description: Cap on time-series retention in days (0 means no cap)
    QuotaExceededError:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          example: quota_exceeded
        quota:
          type: string
          enum: [max_souls, max_journeys, max_alert_channels, max_team_members, check_interval_min]
        workspace:
          type: string
        limit:
          description: The count limit, or the minimum interval for check_interval_min
          oneOf:
          - type: integer
          - type: string
        current:
          type: integer
    MemberRole:
      type: string
      enum: [owner, admin, editor, api, viewer]
    Member:
      type: object
      required: [id, email, name, role, workspace, source, disabled, created_at, updated_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        workspace:
          type: string
        source:
          type: string
          enum: [local, oidc, ldap]
        disabled:
          type: boolean
        must_change_password:
          type: boolean
        configured_admin:
          type: boolean
          description: The account named by auth.local.admin_email; it cannot be disabled or deleted
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
    MemberCreate:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        password:
          type: string
          description: Initial password (policy-checked); omit to add an existing account
        role:
          $ref: '#/components/schemas/MemberRole'
    MemberUpdate:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/MemberRole'
        disabled:
          type: boolean
        name:
          type: string
    Invitation:
      type: object
      required: [id, email, role, workspace, invited_by, created_at, expires_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/MemberRole'
        workspace:
          type: string
        invited_by:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    InvitationCreated:
      allOf:
      - $ref: '#/components/schemas/Invitation'
      - type: object
        required: [email_sent]
        properties:
          email_sent:
            type: boolean
          invite_url:
            type: string
            description: The one-time accept link, present only when it was not emailed
    APIKey:
      type: object
      required: [id, name, prefix, workspace_id, owner_id, role, status, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: Non-secret head of the key (anb_<id>)
        workspace_id:
          type: string
        owner_id:
          type: string
        owner_email:
          type: string
        role:
          type: string
          enum: [owner, admin, editor, api, viewer]
        status:
          type: string
          enum: [active, expired, revoked]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          description: Updated at most every few minutes
        revoked_at:
          type: string
          format: date-time
        revoked_by:
          type: string
    APIKeyCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
        role:
          type: string
          enum: [owner, admin, editor, api, viewer]
          description: Defaults to the caller's role; may not rank above it
        expires_at:
          type: string
          format: date-time
          description: Optional, at most 366 days ahead
        expires_in_days:
          type: integer
          minimum: 0
          maximum: 366
          description: Alternative to expires_at; 0 or absent means no expiry
    APIKeyCreated:
      allOf:
      - $ref: '#/components/schemas/APIKey'
      - type: object
        required: [key]
        properties:
          key:
            type: string
            description: The plaintext key. Shown once; store it now.
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
  responses:
    QuotaExceeded:
      description: >-
        The create would exceed a workspace quota. Existing resources stay
        readable and editable; delete one or raise the limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/QuotaExceededError'
    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LeaderUnavailableError:
      description: >-
        The cluster has no reachable Raft leader (an election is in progress
        or this node is cut off from the majority). The write was not applied
        and can be retried after Retry-After seconds. The body may name the
        last known leader.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              leader:
                type: string
    RateLimitError:
      description: Too many requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

      properties:
        total_alerts:
          type: integer
        sent_alerts:
          type: integer
        failed_alerts:
          type: integer
        acknowledged_alerts:
          type: integer
        resolved_alerts:
          type: integer
        rate_limited_alerts:
          type: integer
        filtered_alerts:
          type: integer
        active_incidents:
          type: integer
        last_alert_time:
          type: string
          format: date-time
        verdicts_by_severity:
          type: object
          nullable: true
          additionalProperties:
            type: integer
    ClusterNodeRequest:

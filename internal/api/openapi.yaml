  /api/v1/auth/accept-invite:
    post:
      summary: Accept an invitation
      description: >-
        Public. Redeems the one-time invitation token (from the emailed or
        shared /accept-invite link), creating a local account with the given
        name and password and the invited role in the invited workspace. If
        the address already has a local account, `password` must be its
        current password and the membership is added to it (name is ignored).
        The token is single-use, expires seven days after it was issued, and
        is void once its inviter is disabled, removed, or no longer holds
        members:* at or above the invited role.
      tags:
      - Members
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                name:
                  type: string
                  maxLength: 100
                password:
                  type: string
                  description: At least 12 characters from 3 of 4 classes
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Invalid or expired token, or the password fails the policy
        '409':
          description: An account with this email already exists
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/members:
    get:
      summary: List workspace members
      description: >-
        Lists the accounts holding a role in the caller's workspace: local
        accounts, and OIDC/LDAP accounts provisioned at their first sign-in.
        Requires members:* (owner, admin) and an interactive session; API keys
        are refused with 403.
      tags:
      - Members
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Missing permission, or the caller is an API key
    post:
      summary: Create a member
      description: >-
        Creates a local account with an initial password in the caller's
        workspace; the account must change it at its first sign-in. An email
        that already has an account is refused (409): existing accounts join a
        workspace only by accepting an invitation. The role may not rank above
        the caller's (owner > admin > editor > api > viewer). Counts against
        tenants.default_quotas.max_team_members.
      tags:
      - Members
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role above the caller's, missing permission, or the caller is an API key
        '409':
          description: Already a member, email has an account, account limit, or max_team_members reached
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/members/{id}:
    patch:
      summary: Update a member
      description: >-
        Changes a member's role in the caller's workspace, disables or
        enables the account, or renames it. The caller may not manage a member
        ranked above it, grant a role above its own, or leave the workspace
        without an enabled owner. Disabling, and any role change that is not a
        pure upgrade, ends the account's sessions and live WebSocket/SSE
        streams; its API keys stop authenticating while it lacks the role.
        Disabling affects every workspace, so only the configured admin may
        disable an account that belongs to other workspaces too.
      tags:
      - Members
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Privilege escalation, self-disable, or the caller is an API key
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Would leave the workspace without an enabled owner
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
    delete:
      summary: Remove a member from the workspace
      description: >-
        Removes the account from the caller's workspace and ends its sessions.
        An account left without any workspace is deleted.
      tags:
      - Members
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Member ranked above the caller, or the caller is an API key
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Would leave the workspace without an enabled owner
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/users/{id}:
    delete:
      summary: Delete an account
      description: >-
        Deletes the account everywhere and ends its sessions. The configured
        admin (auth.local.admin_email) and the caller's own account cannot be
        deleted, and only the configured admin may delete an account that
        belongs to other workspaces.
      tags:
      - Members
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Not allowed for this account, or the caller is an API key
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: Would leave a workspace without an enabled owner
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/invitations:
    get:
      summary: List pending invitations
      description: Pending, unexpired invitations to the caller's workspace. Tokens are never returned.
      tags:
      - Members
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Missing permission, or the caller is an API key
    post:
      summary: Invite a member
      description: >-
        Invites an email address to the caller's workspace with a role no
        higher than the caller's. The single-use token is stored only as a
        SHA-256 hash and expires after seven days. With mail configured
        (mail.* and server.public_url) the /accept-invite link is emailed and
        not returned; otherwise, or if the email cannot be queued,
        `invite_url` carries it this one time for the administrator to share.
        Re-inviting an address replaces its pending invitation. Pending
        invitations count against max_team_members.
      tags:
      - Members
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: '#/components/schemas/MemberRole'
      responses:
        '201':
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role above the caller's, missing permission, or the caller is an API key
        '409':
          description: Already a member, too many pending invitations, or max_team_members reached
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/invitations/{id}:
    delete:
      summary: Revoke an invitation
      tags:
      - Members
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Revoked
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Invitation role above the caller's, or the caller is an API key
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'

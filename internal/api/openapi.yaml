  /status/subscribe:
    post:
      summary: Subscribe to a status page by email (double opt-in)
      description: >-
        Public. Sends a confirmation email whose single-use link expires after
        48 hours; nothing else is sent until it is confirmed. The answer is
        identical whether the address is new, pending or already subscribed.
        Accepts JSON or an HTML form post (the page's own form). Rate limited
        per client IP (10 per 10 minutes) and per address (3 confirmation
        emails per day). Answers 503 when the server has no outgoing mail.
      tags:
      - Status Pages
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                page_id:
                  type: string
                  description: Status page ID (or give slug)
                slug:
                  type: string
                email:
                  type: string
                  format: email
                type:
                  type: string
                  enum:
                  - email
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                page_id:
                  type: string
                email:
                  type: string
      responses:
        '202':
          description: Accepted; a confirmation email is sent if the address can receive one
        '400':
          description: Invalid request or email address
        '404':
          description: Status page not found
        '429':
          description: Too many requests
        '503':
          description: Subscriptions unavailable (no outgoing mail configured)
  /status/subscriptions/confirm:
    get:
      summary: Show the subscription confirmation button
      description: Renders a page with a POST button, so link scanners cannot confirm.
      tags:
      - Status Pages
      security: []
      parameters:
      - &id_sub_page
        in: query
        name: page
        required: true
        schema:
          type: string
      - &id_sub_id
        in: query
        name: id
        required: true
        schema:
          type: string
      - &id_sub_token
        in: query
        name: token
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Confirmation page
        '400':
          description: Link invalid or expired
    post:
      summary: Confirm a subscription
      description: Marks the subscription confirmed; the token is single use.
      tags:
      - Status Pages
      security: []
      parameters:
      - *id_sub_page
      - *id_sub_id
      - *id_sub_token
      responses:
        '200':
          description: Subscription confirmed
        '400':
          description: Link invalid or expired
  /status/subscriptions/unsubscribe:
    get:
      summary: Show the unsubscribe button
      tags:
      - Status Pages
      security: []
      parameters:
      - *id_sub_page
      - *id_sub_id
      - *id_sub_token
      responses:
        '200':
          description: Unsubscribe page
        '400':
          description: Link invalid
    post:
      summary: Unsubscribe (also the RFC 8058 one-click target of List-Unsubscribe)
      tags:
      - Status Pages
      security: []
      parameters:
      - *id_sub_page
      - *id_sub_id
      - *id_sub_token
      responses:
        '200':
          description: Unsubscribed (idempotent)
        '400':
          description: Link invalid
  /ws:
    get:
      responses:
        '101':
          description: Upgrade
      summary: WebSocket
      tags:
      - WebSocket
components:
  parameters:
    ReportFrom:
      name: from
      in: query
      description: Start of the period (inclusive), RFC3339 or YYYY-MM-DD (UTC). Defaults to 30 days before to.
      schema:
        type: string
    ReportTo:
      name: to
      in: query
      description: End of the period (exclusive), RFC3339 or YYYY-MM-DD (UTC). Defaults to now; later values are cut to now.
      schema:
        type: string
    ReportSoulID:
      name: soul_id
      in: query
      description: Report on this soul only.
      schema:
        type: string
    ReportTarget:
      name: target
      in: query
      description: SLO target in percent (0 < target <= 100), e.g. 99.9; adds error_budget.
      schema:
        type: number
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    DashboardBranding:
      type: object
      required: [title, logo, theme]
      properties:
        title:
          type: string
          description: Dashboard title ("AnubisWatch" when unset)
        logo:
          type: string
          description: Logo as an https URL or a same-origin path; empty for the default logo
        theme:
          type: string
          enum: [auto, dark, light]
          description: Default theme for viewers who have not chosen one (auto keeps the dashboard default)
    User:
      type: object
      required: [id, email, name, role, workspace, created_at]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: '#/components/schemas/MemberRole'
        workspace:
          type: string
        created_at:
          type: string
          format: date-time
        must_change_password:
          type: boolean
          description: The account was created with an initial password; until it is changed only /auth/me and /auth/change-password are allowed
        api_key_id:
          type: string
          description: Set when the request authenticated with an API key; id is then apikey:<api_key_id>
    Duration:
      type: string
      description: >-
        Go duration string such as "30s", "5m" or "1h30m". A bare JSON number
        is read as nanoseconds.
      example: 30s
    SoulType:
      type: string
      enum:
      - http
      - tcp
      - udp
      - dns
      - smtp
      - imap
      - icmp
      - grpc
      - websocket
      - tls
      - heartbeat
    Soul:
      type: object
      required: [id, workspace_id, name, type, target, weight, timeout, enabled]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/SoulType'
        target:
          type: string
        status:
          type: string
          description: >-
            Current status from the latest judgment (alive is reported as
            healthy, dead as unhealthy). embalmed means the soul is inside an
            active maintenance window; unknown means it has not been checked.
          enum:
          - healthy
          - unhealthy
          - degraded
          - unknown
          - embalmed
        weight:
          $ref: '#/components/schemas/Duration'
        timeout:
          $ref: '#/components/schemas/Duration'
        enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
        region:
          type: string
        http:
          $ref: '#/components/schemas/HTTPConfig'
        tcp:
          $ref: '#/components/schemas/TCPConfig'
        udp:
          $ref: '#/components/schemas/UDPConfig'
        dns:
          $ref: '#/components/schemas/DNSConfig'
        smtp:
          $ref: '#/components/schemas/SMTPConfig'
        imap:
          $ref: '#/components/schemas/IMAPConfig'
        icmp:
          $ref: '#/components/schemas/ICMPConfig'
        grpc:
          $ref: '#/components/schemas/GRPCConfig'
        websocket:
          $ref: '#/components/schemas/WebSocketConfig'
        tls:
          $ref: '#/components/schemas/TLSConfig'
        heartbeat:
          $ref: '#/components/schemas/HeartbeatConfig'
        retries:
          type: integer
          minimum: 0
          maximum: 5
          description: Confirmation retries before a failed check is recorded as dead.
        retry_interval:
          $ref: '#/components/schemas/Duration'
        flap_detection:
          $ref: '#/components/schemas/FlapDetection'
        flapping:
          type: boolean
          description: >-
            True while the soul is flapping (its latest judgment carries the
            flag). Status alerts are suppressed while it is set; status keeps
            its usual value.
        last_check:
          type: string
          format: date-time
          description: Time of the latest judgment; absent until the soul has been checked.
        latency:
          type: integer
          description: Latency of the latest judgment in milliseconds; absent (0) until checked.
        has_secrets:
          type: object
          description: Which redacted secret fields (for example http.headers.Authorization) are set.
          additionalProperties:
            type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FlapDetection:
      type: object
      required: [enabled]
      description: >-
        Per-soul override of probe.flap_detection. A soul is flapping after
        threshold status changes within window, and stops flapping once fewer
        than half the threshold (rounded up) remain in the window.
      properties:
        enabled:
          type: boolean
        threshold:
          type: integer
          minimum: 0
          maximum: 50
          description: Status changes that start flapping; 0 inherits (default 5, explicit 2-50).
        window:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Sliding window; unset inherits (default 10m, explicit 10s-24h).
    HeartbeatConfig:
      type: object
      description: >-
        Push-monitor settings. The soul's weight is the expected ping
        interval (at most 31 days).
      properties:
        grace:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: >-
            How late a ping may be before the soul is judged dead; 1s to 7d,
            default half the interval.
        token:
          type: string
          description: >-
            Ping token. Generated by the server and always returned as
            [REDACTED] here; read it from GET /api/v1/souls/{id}/heartbeat.
            Ignored on create and update (use the rotate endpoint).
    HeartbeatState:
      type: object
      nullable: true
      description: Null until the soul has received a ping.
      required: [soul_id, workspace_id, pings]
      properties:
        soul_id:
          type: string
        workspace_id:
          type: string
        last_ping_at:
          type: string
          format: date-time
        last_event:
          type: string
          enum: [success, fail]
        last_start_at:
          type: string
          format: date-time
        last_duration:
          type: integer
          description: Run time in nanoseconds, measured from the matching /start.
        last_message:
          type: string
        last_source:
          type: string
        last_node:
          type: string
        pings:
          type: integer
    HeartbeatInfo:
      type: object
      required: [soul_id, interval, grace, state]
      properties:
        soul_id:
          type: string
        token:
          type: string
          description: Present only for roles that may edit souls.
        ping_url:
          type: string
        start_url:
          type: string
        fail_url:
          type: string
        interval:
          $ref: '#/components/schemas/Duration'
        grace:
          $ref: '#/components/schemas/Duration'
        state:
          $ref: '#/components/schemas/HeartbeatState'
    SoulCreate:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/SoulType'
        target:
          type: string
          description: >-
            http(s):// URL for http, ws(s):// URL for websocket, host:port for
            the other types. Required except for heartbeat.
        weight:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Check interval, at least 1s.
        timeout:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Per-check timeout, at least 1ms.
        enabled:
          type: boolean
          default: true
        tags:
          type: array
          items:
            type: string
        regions:
          type: array
          description: Restrict the soul to probes in these regions.
          items:
            type: string
        http:
          $ref: '#/components/schemas/HTTPConfig'
        tcp:
          $ref: '#/components/schemas/TCPConfig'
        udp:
          $ref: '#/components/schemas/UDPConfig'
        dns:
          $ref: '#/components/schemas/DNSConfig'
        smtp:
          $ref: '#/components/schemas/SMTPConfig'
        imap:
          $ref: '#/components/schemas/IMAPConfig'
        icmp:
          $ref: '#/components/schemas/ICMPConfig'
        grpc:
          $ref: '#/components/schemas/GRPCConfig'
        websocket:
          $ref: '#/components/schemas/WebSocketConfig'
        tls:
          $ref: '#/components/schemas/TLSConfig'
        heartbeat:
          $ref: '#/components/schemas/HeartbeatConfig'
        retries:
          type: integer
          minimum: 0
          maximum: 5
          default: 0
          description: >-
            Re-run a failed check up to this many times, retry_interval apart,
            before recording it as dead. Exactly one judgment is recorded per
            scheduled check, with details.attempts. Ignored for heartbeat souls
            and manual checks.
        retry_interval:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Pause between retries; default 5s, at least 100ms and shorter than weight.
        flap_detection:
          $ref: '#/components/schemas/FlapDetection'
    SoulUpdate:
      allOf:
      - $ref: '#/components/schemas/SoulCreate'
      description: >-
        Replaces the whole soul. An omitted enabled keeps the stored value.
    HTTPConfig:
      type: object
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - HEAD
          - OPTIONS
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        valid_status:
          type: array
          items:
            type: integer
        body_contains:
          type: string
        body_regex:
          type: string
        json_path:
          type: object
          description: JSONPath expression → expected value.
          additionalProperties:
            type: string
        json_schema:
          type: string
        json_schema_strict:
          type: boolean
        response_headers:
          type: object
          additionalProperties:
            type: string
        feather:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Latency budget; slower responses are degraded.
        follow_redirects:
          type: boolean
        max_redirects:
          type: integer
        insecure_skip_verify:
          type: boolean
          description: Only honoured when the server runs with --insecure-skip-verify.
    TCPConfig:
      type: object
      properties:
        banner_match:
          type: string
        send:
          type: string
        expect_regex:
          type: string
    UDPConfig:
      type: object
      properties:
        send_hex:
          type: string
        expect_contains:
          type: string
    DNSConfig:
      type: object
      properties:
        record_type:
          type: string
          enum: [A, AAAA, CNAME, MX, TXT, NS, SOA, PTR, SRV]
        expected:
          type: array
          items:
            type: string
        nameservers:
          type: array
          items:
            type: string
        dnssec_validate:
          type: boolean
        propagation_check:
          type: boolean
        propagation_threshold:
          type: integer
    AuthCreds:
      type: object
      description: Login credentials; the password is returned as [REDACTED].
      properties:
        username:
          type: string
        password:
          type: string
    SMTPConfig:
      type: object
      properties:
        ehlo_domain:
          type: string
        starttls:
          type: boolean
        insecure_skip_verify:
          type: boolean
        auth:
          $ref: '#/components/schemas/AuthCreds'
        banner_contains:
          type: string
    IMAPConfig:
      type: object
      properties:
        tls:
          type: boolean
        auth:
          $ref: '#/components/schemas/AuthCreds'
        check_mailbox:
          type: string
        insecure_skip_verify:
          type: boolean
    ICMPConfig:
      type: object
      properties:
        count:
          type: integer
        interval:
          $ref: '#/components/schemas/Duration'
        max_loss_percent:
          type: number
        feather:
          $ref: '#/components/schemas/Duration'
        ipv6:
          type: boolean
        privileged:
          type: boolean
    GRPCConfig:
      type: object
      properties:
        service:
          type: string
          description: Service name for the gRPC health check; empty checks the server.
        tls:
          type: boolean
        tls_ca:
          type: string
        insecure_skip_verify:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
        feather:
          $ref: '#/components/schemas/Duration'
    WebSocketConfig:
      type: object
      properties:
        headers:
          type: object
          additionalProperties:
            type: string
        subprotocols:
          type: array
          items:
            type: string
        send:
          type: string
        expect_contains:
          type: string
        ping_check:
          type: boolean
        feather:
          $ref: '#/components/schemas/Duration'
        insecure_skip_verify:
          type: boolean
    TLSConfig:
      type: object
      properties:
        expiry_warn_days:
          type: integer
        expiry_critical_days:
          type: integer
        min_protocol:
          type: string
        forbidden_ciphers:
          type: array
          items:
            type: string
        expected_issuer:
          type: string
        expected_san:
          type: array
          items:
            type: string
        check_ocsp:
          type: boolean
        min_key_bits:
          type: integer
    SLAReport:
      type: object
      required: [period_seconds, excluded_seconds, monitored_seconds, no_data_seconds, checks, failed, availability_percent, downtime_seconds, incidents, mttr_seconds, latency, sources]
      description: >-
        SLA of one soul, or of the workspace (summary, soul_id omitted) where
        durations are summed over souls (soul-seconds).
      properties:
        soul_id:
          type: string
        soul_name:
          type: string
        soul_type:
          type: string
        period_seconds:
          type: number
        excluded_seconds:
          type: number
          description: Maintenance time cut out of the period.
        monitored_seconds:
          type: number
          description: period_seconds minus excluded_seconds.
        no_data_seconds:
          type: number
          description: Monitored time without any recorded check.
        checks:
          type: integer
        failed:
          type: integer
        availability_percent:
          type: number
          nullable: true
          description: Alive checks / all checks; null without checks.
        downtime_seconds:
          type: number
          description: Estimated per bucket as bucket length x failed / checks.
        incidents:
          type: integer
          description: Alert incidents that started in the period.
        mttr_seconds:
          type: number
          nullable: true
          description: Mean time to resolve over those incidents that are resolved.
        latency:
          type: object
          nullable: true
          required: [avg_ms, p50_ms, p95_ms, p99_ms, exact]
          properties:
            avg_ms:
              type: number
            p50_ms:
              type: number
            p95_ms:
              type: number
            p99_ms:
              type: number
            exact:
              type: boolean
              description: False when rollup averages stood in for checks.
        error_budget:
          type: object
          required: [target_percent, allowed_downtime_seconds, consumed_downtime_seconds, remaining_downtime_seconds, remaining_percent, met]
          description: Present when target was given.
          properties:
            target_percent:
              type: number
            allowed_downtime_seconds:
              type: number
            consumed_downtime_seconds:
              type: number
            remaining_downtime_seconds:
              type: number
            remaining_percent:
              type: number
              nullable: true
              description: Negative once overspent; null when the target allows no downtime.
            met:
              type: boolean
        sources:
          type: object
          required: [raw, hour, day]
          description: Buckets read from each source.
          properties:
            raw:
              type: integer
            hour:
              type: integer
            day:
              type: integer
    SLAResponse:
      type: object
      required: [from, to, generated_at, target_percent, retention_horizon, clipped, summary, souls]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        generated_at:
          type: string
          format: date-time
        target_percent:
          type: number
          nullable: true
        retention_horizon:
          type: string
          format: date-time
          nullable: true
          description: Oldest instant retention keeps data for; null when unlimited.
        clipped:
          type: boolean
          description: True when from was moved forward to retention_horizon.
        summary:
          $ref: '#/components/schemas/SLAReport'
        souls:
          type: array
          items:
            $ref: '#/components/schemas/SLAReport'
    JudgmentExportRecord:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        id:
          type: string
        soul_id:
          type: string
        status:
          type: string
        duration_ms:
          type: number
        status_code:
          type: integer
        region:
          type: string
        jackal_id:
          type: string
        message:
          type: string
    UptimeWindow:
      type: object
      required: [checks, up, failures, uptime_percent, avg_latency_ms]
      properties:
        checks:
          type: integer
        up:
          type: integer
        failures:
          type: integer
        uptime_percent:
          type: number
          nullable: true
          description: Null when there were no checks in the period.
        avg_latency_ms:
          type: number
    SoulUptime:
      type: object
      required: [soul_id, windows, series]
      properties:
        soul_id:
          type: string
        windows:
          $ref: '#/components/schemas/UptimeWindows'
        series:
          type: object
          required: [range, step_seconds, points]
          properties:
            range:
              type: string
              enum: [1h, 24h, 7d, 30d, 90d, 1y]
            step_seconds:
              type: integer
            points:
              type: array
              description: Equal buckets, oldest first.
              items:
                $ref: '#/components/schemas/UptimePoint'
    UptimeWindows:
      type: object
      description: The fixed trailing periods, keyed by "24h", "7d" and "30d".
      required: [24h, 7d, 30d]
      properties:
        24h:
          $ref: '#/components/schemas/UptimeWindow'
        7d:
          $ref: '#/components/schemas/UptimeWindow'
        30d:
          $ref: '#/components/schemas/UptimeWindow'
    UptimePoint:
      allOf:
      - $ref: '#/components/schemas/UptimeWindow'
      - type: object
        required: [start]
        properties:
          start:
            type: string
            format: date-time
    Judgment:
      type: object
      description: >-
        One check result. Latency is duration, in nanoseconds; the failure
        reason is message.
      required: [id, soul_id, workspace_id, jackal_id, region, timestamp, duration, status, status_code, message]
      properties:
        id:
          type: string
        soul_id:
          type: string
        workspace_id:
          type: string
        soul_name:
          type: string
          description: >-
            Name of the soul, on list responses (GET /api/v1/judgments and
            GET /api/v1/souls/{id}/judgments)
        jackal_id:
          type: string
          description: Probe node that ran the check.
        region:
          type: string
        timestamp:
          type: string
          format: date-time
        duration:
          type: integer
          format: int64
          description: Check latency in nanoseconds.
        status:
          $ref: '#/components/schemas/SoulStatus'
        status_code:
          type: integer
          description: Protocol-specific code (HTTP status, DNS rcode, ...); 0 when not applicable.
        message:
          type: string
          description: Human-readable result; the failure reason for a dead judgment.
        details:
          type: object
          description: Protocol-specific details (assertions, attempts, flapping, packet loss, ...).
          additionalProperties: true
        tls_info:
          type: object
          description: Certificate details for TLS-capable checks.
          additionalProperties: true
    SoulStatus:
      type: string
      enum: [alive, dead, degraded, unknown, embalmed]
    AlertChannelType:
      type: string
      enum:
      - slack
      - discord
      - telegram
      - sms
      - email
      - pagerduty
      - opsgenie
      - ntfy
      - webhook
    AlertChannel:
      type: object
      required: [id, name, type, enabled, config, rate_limit, retry_policy]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AlertChannelType'
        enabled:
          type: boolean
        workspace_id:
          type: string
        config:
          type: object
          description: Type-specific settings; secret values are redacted.
          additionalProperties: true
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AlertFilter'
        rate_limit:
          $ref: '#/components/schemas/AlertRateLimit'
        retry_policy:
          $ref: '#/components/schemas/AlertRetryPolicy'
        has_secrets:
          type: object
          description: Which secret config keys are set.
          additionalProperties:
            type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertChannelCreate:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/AlertChannelType'
        config:
          type: object
          additionalProperties: true
          description: >-
            Type-specific settings, validated per type (for example url for
            webhook, webhook_url for slack and discord). On update, redacted
            secret values keep the stored secret.
        enabled:
          type: boolean
          default: true
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AlertFilter'
        rate_limit:
          $ref: '#/components/schemas/AlertRateLimit'
        retry_policy:
          $ref: '#/components/schemas/AlertRetryPolicy'
    AlertFilter:
      type: object
      properties:
        field:
          type: string
        operator:
          type: string
          enum:
          - eq
          - ne
          - in
          - not_in
          - contains
        value:
          type: string
        values:
          type: array
          items:
            type: string
    AlertRateLimit:
      type: object
      properties:
        enabled:
          type: boolean
        max_alerts:
          type: integer
        window:
          $ref: '#/components/schemas/Duration'
        grouping_key:
          type: string
    AlertRetryPolicy:
      type: object
      properties:
        max_retries:
          type: integer
        initial_wait:
          $ref: '#/components/schemas/Duration'
        max_wait:
          $ref: '#/components/schemas/Duration'
        backoff:
          type: string
    AlertRule:
      type: object
      required: [id, name, enabled, scope, conditions, channels, severity, cooldown, auto_resolve, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        workspace_id:
          type: string
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AlertCondition'
        channels:
          type: array
          items:
            type: string
        severity:
          type: string
          enum:
          - critical
          - warning
          - info
        cooldown:
          $ref: '#/components/schemas/Duration'
        auto_resolve:
          type: boolean
        escalation:
          type: object
        created_at:
          type: string
          format: date-time
    AlertRuleCreate:
      type: object
      required:
      - name
      - conditions
      - channels
      properties:
        name:
          type: string
        enabled:
          type: boolean
          default: true
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        conditions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AlertCondition'
        channels:
          type: array
          minItems: 1
          description: Alert channel IDs to notify.
          items:
            type: string
        severity:
          type: string
          enum:
          - critical
          - warning
          - info
        cooldown:
          $ref: '#/components/schemas/Duration'
        auto_resolve:
          type: boolean
        escalation:
          type: object
    AlertRuleScope:
      type: object
      properties:
        type:
          type: string
          enum:
          - all
          - tag
          - type
          - specific
        tags:
          type: array
          items:
            type: string
        soul_types:
          type: array
          items:
            type: string
        soul_ids:
          type: array
          items:
            type: string
        workspaces:
          type: array
          items:
            type: string
    AlertCondition:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - consecutive_failures
          - threshold
          - percentage
          - anomaly
          - compound
          - status_change
          - status_for
          - failure_rate
        threshold:
          type: integer
          minimum: 0
        metric:
          type: string
          description: >-
            For threshold: latency, latency_ms, duration, status_code or
            tls_expiry_days. For anomaly: the same without tls_expiry_days.
        operator:
          type: string
          description: Comparison such as >, <, ==, >=, <=, !=.
        value:
          description: Value to compare the metric against.
        window:
          $ref: '#/components/schemas/Duration'
        from:
          type: string
          description: Previous status, for status_change.
        to:
          type: string
          description: New status, for status_change.
        status:
          type: string
          description: Status to hold, for status_for.
        duration:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: How long the status must hold, for status_for.
        sub_conditions:
          type: array
          description: For compound.
          items:
            $ref: '#/components/schemas/AlertCondition'
        logic:
          type: string
          enum:
          - and
          - or
        anomaly_std_dev:
          type: number
    Incident:
      type: object
      required: [id, rule_id, soul_id, workspace_id, status, severity, started_at, notes, events, escalation_level]
      properties:
        id:
          type: string
        rule_id:
          type: string
        soul_id:
          type: string
        soul_name:
          type: string
        workspace_id:
          type: string
        status:
          type: string
          enum: [open, acknowledged, resolved]
        severity:
          type: string
          enum: [critical, warning, info]
        started_at:
          type: string
          format: date-time
        acked_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
        acked_by:
          type: string
        resolved_by:
          type: string
        notes:
          type: array
          nullable: true
          items:

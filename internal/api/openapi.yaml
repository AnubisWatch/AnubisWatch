        events:
          type: array
          nullable: true
          description: Alert events of the incident, with their judgments.
          items:
            type: object
            additionalProperties: true
        escalation_level:
          type: integer
        last_escalated_at:
          type: string
          format: date-time
    AlertManagerStats:
      type: object

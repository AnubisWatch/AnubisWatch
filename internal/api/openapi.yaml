    post:
      tags:
      - Status Pages
      summary: Create status page incident
      description: >-
        Opens an incident with its first timeline update. Requires
        settings:write. Title and message are plain text (no HTML; URLs are
        linked on the public page). Confirmed email subscribers are notified
        once, unless the incident is created already resolved.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusIncidentCreate'
      responses:
        '201':
          description: Incident created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusIncident'
        '400':
          description: Invalid incident
        '404':
          description: Status page not found in the caller's workspace
  /api/v1/status-pages/{id}/incidents/{incidentId}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: string
    - in: path
      name: incidentId
      required: true
      schema:
        type: string
    patch:
      tags:
      - Status Pages
      summary: Edit status page incident
      description: >-
        Edits title, impact or affected souls. The status cannot be patched:
        post an update so the timeline and subscribers record the change.
        Sends no notification.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusIncidentPatch'
      responses:
        '200':
          description: Incident updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusIncident'
        '400':
          description: Invalid change
        '404':
          description: Page or incident not found
    delete:
      tags:
      - Status Pages
      summary: Delete status page incident
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '404':

          type: string
        state:
          type: string
        leader:
          type: string
        term:
          type: integer
        peer_count:
          type: integer
        commit_index:
          type: integer
    Peer:
      type: object
      required:
      - id
      - name
      - address
      - state
      - last_contact
      - is_leader
      - region
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        state:
          type: string
          description: leader, follower, candidate, unreachable or unknown
        last_contact:
          type: string
          description: RFC3339 time this node last heard from the peer; empty if never
        is_leader:
          type: boolean
        region:
          type: string
    UIConfig:
      type: object
      properties:
        instance_name:
          type: string
        timezone:
          type: string
        theme:
          type: string
          enum:
          - dark
          - light
          - system
        retention_days:
          type: integer
          description: Raw judgment retention in days; 0 means raw judgments are never pruned
        storage_path:
          type: string
        auth_enabled:
          type: boolean
        auth_type:
          type: string
        mcp_enabled:
          type: boolean
        websocket_enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
        grpc_port:
          type: integer
        tls_enabled:
          type: boolean
        read_only_keys:
          type: array
          description: Keys that come from the config file and cannot be changed through PUT
          items:
            type: string
    UIConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        instance_name:
          type: string
          nullable: true
          maxLength: 100
        timezone:
          type: string
          nullable: true
          maxLength: 64
        theme:
          type: string
          nullable: true
          enum:
          - dark
          - light
          - system
    Journey:
      type: object
      required: [id, workspace_id, name, weight, timeout, continue_on_failure, variables, steps, enabled, created_at, updated_at]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        description:
          type: string
        weight:
          $ref: '#/components/schemas/Duration'
        timeout:
          $ref: '#/components/schemas/Duration'
        continue_on_failure:
          type: boolean
        variables:
          type: object
          nullable: true
          additionalProperties:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JourneyListItem:
      description: A journey as GET /api/v1/journeys lists it, with run statistics.
      allOf:
      - $ref: '#/components/schemas/Journey'
      - type: object
        required: [step_count, last_status, avg_duration, success_rate]
        properties:
          step_count:
            type: integer
          last_run:
            type: string
            format: date-time
            description: Start of the latest run; absent before the first run.
          last_status:
            type: string
            enum: [passed, failed, pending, unknown]
            description: Latest run (alive is passed, dead is failed); unknown before the first run.
          avg_duration:
            type: number
            description: Mean duration of the recent runs, in milliseconds.
          success_rate:
            type: number
            description: Percentage of the recent runs that passed.
    JourneyRun:
      type: object
      required: [id, journey_id, workspace_id, jackal_id, region, started_at, completed_at, duration, status, steps, variables]
      properties:
        id:
          type: string
        journey_id:
          type: string
        workspace_id:
          type: string
        jackal_id:
          type: string
        region:
          type: string
        started_at:
          type: integer
          format: int64
          description: Unix time in milliseconds.
        completed_at:
          type: integer
          format: int64
          description: Unix time in milliseconds.
        duration:
          type: integer
          format: int64
          description: Total duration in milliseconds.
        status:
          $ref: '#/components/schemas/SoulStatus'
        steps:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/JourneyStepResult'
        variables:
          type: object
          nullable: true
          description: Captured variables; secret-looking values are masked.
          additionalProperties:
            type: string
    JourneyStepResult:
      type: object
      required: [name, step_index, status, duration, message]
      properties:
        name:
          type: string
        step_index:
          type: integer
        status:
          $ref: '#/components/schemas/SoulStatus'
        duration:
          type: integer
          format: int64
          description: Milliseconds.
        message:
          type: string
        extracted:
          type: object
          additionalProperties:
            type: string
    JourneyCreate:
      type: object
      required:
      - name
      - steps
      properties:
        name:
          type: string
        description:
          type: string
        weight:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Run interval; defaults to 1m.
        timeout:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Timeout for the whole journey; defaults to 30s.
        continue_on_failure:
          type: boolean
        variables:
          type: object
          description: Default variables, usable in steps as ${name}.
          additionalProperties:
            type: string
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
          default: true
    JourneyStep:
      type: object
      required:
      - name
      - target
      properties:
        name:
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/SoulType'
          description: Defaults to http.
        target:
          type: string
          description: May use ${variable}.
        timeout:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Defaults to 10s.
        http:
          $ref: '#/components/schemas/HTTPConfig'
        tcp:
          type: object
        udp:
          type: object
        dns:
          type: object
        tls:
          type: object
        extract:
          type: object
          description: Variable name → extraction rule {from (body, header, cookie), path, regex}.
          additionalProperties:
            type: object
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/JourneyAssertion'
    JourneyAssertion:
      type: object
      properties:
        type:
          type: string
          description: status_code, body_contains, json_path, header, response_time, ...
        target:
          type: string
          description: JSON path, header name, etc.
        operator:
          type: string
          description: equals, not_equals, contains, greater_than, less_than, regex
        expected:
          type: string
        message:
          type: string
    StatusPage:
      type: object

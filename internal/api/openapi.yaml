components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - user
          - viewer
        workspace:
          type: string
        created_at:
          type: string
          format: date-time
    Duration:
      type: string
      description: >-
        Go duration string such as "30s", "5m" or "1h30m". A bare JSON number
        is read as nanoseconds.
      example: 30s
    SoulType:
      type: string
      enum:
      - http
      - tcp
      - udp
      - dns
      - smtp
      - imap
      - icmp
      - grpc
      - websocket
      - tls
    Soul:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/SoulType'
        target:
          type: string
        status:
          type: string
          description: >-
            Current status from the latest judgment (alive is reported as
            healthy, dead as unhealthy). embalmed means the soul is inside an
            active maintenance window; unknown means it has not been checked.
          enum:
          - healthy
          - unhealthy
          - degraded
          - unknown
          - embalmed
        weight:
          $ref: '#/components/schemas/Duration'
        timeout:
          $ref: '#/components/schemas/Duration'
        enabled:
          type: boolean
        tags:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
        region:
          type: string
        http:
          $ref: '#/components/schemas/HTTPConfig'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SoulCreate:
      type: object
      required:
      - name
      - type
      - target
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/SoulType'
        target:
          type: string
          description: >-
            http(s):// URL for http, ws(s):// URL for websocket, host:port for
            the other types.
        weight:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Check interval, at least 1s.
        timeout:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Per-check timeout, at least 1ms.
        enabled:
          type: boolean
          default: true
        tags:
          type: array
          items:
            type: string
        regions:
          type: array
          description: Restrict the soul to probes in these regions.
          items:
            type: string
        http:
          $ref: '#/components/schemas/HTTPConfig'
        tcp:
          type: object
          description: TCP settings (banner_match, send, expect_regex).
        udp:
          type: object
          description: UDP settings.
        dns:
          type: object
          description: DNS settings; record_type is one of A, AAAA, CNAME, MX, TXT, NS, SOA, PTR, SRV.
        smtp:
          type: object
          description: SMTP settings.
        imap:
          type: object
          description: IMAP settings.
        icmp:
          type: object
          description: ICMP settings.
        grpc:
          type: object
          description: gRPC health-check settings.
        websocket:
          type: object
          description: WebSocket settings.
        tls:
          type: object
          description: TLS certificate settings.
    SoulUpdate:
      allOf:
      - $ref: '#/components/schemas/SoulCreate'
      description: >-
        Replaces the whole soul. An omitted enabled keeps the stored value.
    HTTPConfig:
      type: object
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
          - HEAD
          - OPTIONS
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        valid_status:
          type: array
          items:
            type: integer
        body_contains:
          type: string
        body_regex:
          type: string
        json_path:
          type: object
          description: JSONPath expression → expected value.
          additionalProperties:
            type: string
        json_schema:
          type: string
        json_schema_strict:
          type: boolean
        response_headers:
          type: object
          additionalProperties:
            type: string
        feather:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Latency budget; slower responses are degraded.
        follow_redirects:
          type: boolean
        max_redirects:
          type: integer
        insecure_skip_verify:
          type: boolean
          description: Only honoured when the server runs with --insecure-skip-verify.
    UptimeWindow:
      type: object
      properties:
        checks:
          type: integer
        up:
          type: integer
        failures:
          type: integer
        uptime_percent:
          type: number
          nullable: true
          description: Null when there were no checks in the period.
        avg_latency_ms:
          type: number
    Judgment:
      type: object
      properties:
        id:
          type: string
        soul_id:
          type: string
        soul_name:
          type: string
          description: >-
            Name of the soul, on list responses (GET /api/v1/judgments and
            GET /api/v1/souls/{id}/judgments)
        status:
          type: string
          enum:
          - alive
          - dead
          - degraded
          - unknown
        latency_ms:
          type: integer
        timestamp:
          type: string
          format: date-time
        error:
          type: string
    AlertChannelType:
      type: string
      enum:
      - slack
      - discord
      - telegram
      - sms
      - email
      - pagerduty
      - opsgenie
      - ntfy
      - webhook
    AlertChannel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/AlertChannelType'
        enabled:
          type: boolean
        workspace_id:
          type: string
        config:
          type: object
          description: Type-specific settings; secret values are redacted.
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AlertFilter'
        rate_limit:
          $ref: '#/components/schemas/AlertRateLimit'
        retry_policy:
          $ref: '#/components/schemas/AlertRetryPolicy'
        has_secrets:
          type: object
          description: Which secret config keys are set.
          additionalProperties:
            type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AlertChannelCreate:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/AlertChannelType'
        config:
          type: object
          description: >-
            Type-specific settings, validated per type (for example url for
            webhook, webhook_url for slack and discord). On update, redacted
            secret values keep the stored secret.
        enabled:
          type: boolean
          default: true
        filters:
          type: array
          items:
            $ref: '#/components/schemas/AlertFilter'
        rate_limit:
          $ref: '#/components/schemas/AlertRateLimit'
        retry_policy:
          $ref: '#/components/schemas/AlertRetryPolicy'
    AlertFilter:
      type: object
      properties:
        field:
          type: string
        operator:
          type: string
          enum:
          - eq
          - ne
          - in
          - not_in
          - contains
        value:
          type: string
        values:
          type: array
          items:
            type: string
    AlertRateLimit:
      type: object
      properties:
        enabled:
          type: boolean
        max_alerts:
          type: integer
        window:
          $ref: '#/components/schemas/Duration'
        grouping_key:
          type: string
    AlertRetryPolicy:
      type: object
      properties:
        max_retries:
          type: integer
        initial_wait:
          $ref: '#/components/schemas/Duration'
        max_wait:
          $ref: '#/components/schemas/Duration'
        backoff:
          type: string
    AlertRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        workspace_id:
          type: string
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/AlertCondition'
        channels:
          type: array
          items:
            type: string
        severity:
          type: string
          enum:
          - critical
          - warning
          - info
        cooldown:
          $ref: '#/components/schemas/Duration'
        auto_resolve:
          type: boolean
        escalation:
          type: object
        created_at:
          type: string
          format: date-time
    AlertRuleCreate:
      type: object
      required:
      - name
      - conditions
      - channels
      properties:
        name:
          type: string
        enabled:
          type: boolean
          default: true
        scope:
          $ref: '#/components/schemas/AlertRuleScope'
        conditions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AlertCondition'
        channels:
          type: array
          minItems: 1
          description: Alert channel IDs to notify.
          items:
            type: string
        severity:
          type: string
          enum:
          - critical
          - warning
          - info
        cooldown:
          $ref: '#/components/schemas/Duration'
        auto_resolve:
          type: boolean
        escalation:
          type: object
    AlertRuleScope:
      type: object
      properties:
        type:
          type: string
          enum:
          - all
          - tag
          - type
          - specific
        tags:
          type: array
          items:
            type: string
        soul_types:
          type: array
          items:
            type: string
        soul_ids:
          type: array
          items:
            type: string
        workspaces:
          type: array
          items:
            type: string
    AlertCondition:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - consecutive_failures
          - threshold
          - percentage
          - anomaly
          - compound
          - status_change
          - status_for
          - failure_rate
        threshold:
          type: integer
          minimum: 0
        metric:
          type: string
          description: >-
            For threshold: latency, latency_ms, duration, status_code or
            tls_expiry_days. For anomaly: the same without tls_expiry_days.
        operator:
          type: string
          description: Comparison such as >, <, ==, >=, <=, !=.
        value:
          description: Value to compare the metric against.
        window:
          $ref: '#/components/schemas/Duration'
        from:
          type: string
          description: Previous status, for status_change.
        to:
          type: string
          description: New status, for status_change.
        status:
          type: string
          description: Status to hold, for status_for.
        duration:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: How long the status must hold, for status_for.
        sub_conditions:
          type: array
          description: For compound.
          items:
            $ref: '#/components/schemas/AlertCondition'
        logic:
          type: string
          enum:
          - and
          - or
        anomaly_std_dev:
          type: number
    ClusterNodeRequest:
      type: object
      required:
      - address
      properties:
        node_id:
          type: string
          description: >-
            Raft node ID of the member (its necropolis.raft.node_id). Optional
            on add: when omitted it is learned from the node at address.
        address:
          type: string
          description: The member's Raft address, host:port
        region:
          type: string
    ClusterStatus:
      type: object
      properties:
        is_clustered:
          type: boolean
        node_id:
          type: string
        state:
          type: string
        leader:
          type: string
        term:
          type: integer
        peer_count:
          type: integer
    Peer:
      type: object
      required:
      - id
      - name
      - address
      - state
      - last_contact
      - is_leader
      - region
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        state:
          type: string
          description: leader, follower, candidate, unreachable or unknown
        last_contact:
          type: string
          description: RFC3339 time this node last heard from the peer; empty if never
        is_leader:
          type: boolean
        region:
          type: string
    UIConfig:
      type: object
      properties:
        instance_name:
          type: string
        timezone:
          type: string
        theme:
          type: string
          enum:
          - dark
          - light
          - system
        retention_days:
          type: integer
          description: Raw judgment retention in days; 0 means raw judgments are never pruned
        storage_path:
          type: string
        auth_enabled:
          type: boolean
        auth_type:
          type: string
        mcp_enabled:
          type: boolean
        websocket_enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
        grpc_port:
          type: integer
        tls_enabled:
          type: boolean
        read_only_keys:
          type: array
          description: Keys that come from the config file and cannot be changed through PUT
          items:
            type: string
    UIConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        instance_name:
          type: string
          nullable: true
          maxLength: 100
        timezone:
          type: string
          nullable: true
          maxLength: 64
        theme:
          type: string
          nullable: true
          enum:
          - dark
          - light
          - system
    Journey:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        description:
          type: string
        weight:
          $ref: '#/components/schemas/Duration'
        timeout:
          $ref: '#/components/schemas/Duration'
        continue_on_failure:
          type: boolean
        variables:
          type: object
          additionalProperties:
            type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    JourneyCreate:
      type: object
      required:
      - name
      - steps
      properties:
        name:
          type: string
        description:
          type: string
        weight:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Run interval; defaults to 1m.
        timeout:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Timeout for the whole journey; defaults to 30s.
        continue_on_failure:
          type: boolean
        variables:
          type: object
          description: Default variables, usable in steps as ${name}.
          additionalProperties:
            type: string
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
          default: true
    JourneyStep:
      type: object
      required:
      - name
      - target
      properties:
        name:
          type: string
        type:
          allOf:
          - $ref: '#/components/schemas/SoulType'
          description: Defaults to http.
        target:
          type: string
          description: May use ${variable}.
        timeout:
          allOf:
          - $ref: '#/components/schemas/Duration'
          description: Defaults to 10s.
        http:
          $ref: '#/components/schemas/HTTPConfig'
        tcp:
          type: object
        udp:
          type: object
        dns:
          type: object
        tls:
          type: object
        extract:
          type: object
          description: Variable name → extraction rule {from (body, header, cookie), path, regex}.
          additionalProperties:
            type: object
        assertions:
          type: array
          items:
            $ref: '#/components/schemas/JourneyAssertion'
    JourneyAssertion:
      type: object
      properties:
        type:
          type: string
          description: status_code, body_contains, json_path, header, response_time, ...
        target:
          type: string
          description: JSON path, header name, etc.
        operator:
          type: string
          description: equals, not_equals, contains, greater_than, less_than, regex
        expected:
          type: string
        message:
          type: string
    StatusPage:
      type: object
      properties:
        id:
          type: string
        workspace_id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        logo_url:
          type: string
        favicon_url:
          type: string
        custom_domain:
          type: string
        theme:
          type: object
        visibility:
          type: string
          enum:
          - public
          - private
          - protected
        password_set:
          type: boolean
          description: Whether a password is configured; the password itself is never returned.
        enabled:
          type: boolean
        souls:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: object
        uptime_days:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StatusPageCreate:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
        slug:
          type: string
          pattern: '^[a-z0-9-]+$'
          maxLength: 100
        description:
          type: string
        logo_url:
          type: string
        favicon_url:
          type: string
        custom_domain:
          type: string
        theme:
          type: object
          properties:
            primary_color:
              type: string
            background_color:
              type: string
            text_color:
              type: string
            accent_color:
              type: string
            font_family:
              type: string
            custom_css:
              type: string
        visibility:
          type: string
          enum:
          - public
          - private
          - protected
        password:
          type: string
          format: password
          description: >-
            Required for a protected page. On update, omit to keep the stored
            password; an empty string clears it.
        enabled:
          type: boolean
          default: true
        souls:
          type: array
          description: Soul IDs to show; each must belong to the caller's workspace.
          items:
            type: string
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              description:
                type: string
              soul_ids:
                type: array
                items:
                  type: string
              order:
                type: integer
        uptime_days:
          type: integer
          default: 90
    MaintenanceWindowCreate:
      type: object
      required:
      - name
      - start_time
      - end_time
      properties:
        name:
          type: string
        description:
          type: string
        soul_ids:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
          description: Must be after start_time.
        recurring:
          type: string
          enum:
          - ''
          - none
          - daily
          - weekly
          - monthly
        enabled:
          type: boolean
          default: true
    MaintenanceWindowUpdate:
      type: object
      description: Partial update; only the fields sent are changed.
      properties:
        name:
          type: string
        description:
          type: string
        soul_ids:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        recurring:
          type: string
          enum:
          - ''
          - none
          - daily
          - weekly
          - monthly
        enabled:
          type: boolean
    CustomDashboardInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        refresh_sec:
          type: integer
        widgets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              title:
                type: string
              type:
                type: string
                enum:
                - line_chart
                - bar_chart
                - gauge
                - stat
                - table
              grid:
                type: object
                properties:
                  x:
                    type: integer
                  y:
                    type: integer
                  width:
                    type: integer
                    minimum: 1
                    maximum: 12
                  height:
                    type: integer
              query:
                $ref: '#/components/schemas/WidgetQuery'
              thresholds:
                type: array
                items:
                  type: object
                  properties:
                    value:
                      type: number
                    color:
                      type: string
                    op:
                      type: string
    WidgetQuery:
      type: object
      required:
      - source
      properties:
        source:
          type: string
          enum:
          - souls
          - judgments
          - stats
          - alerts
        metric:
          type: string
          description: For souls, one of count, list, status_distribution.
        filters:
          type: object
          description: For example soul_id.
          additionalProperties:
            type: string
        time_range:
          type: string
          description: Number with an h, d or w suffix, such as 24h or 7d.
        aggregation:
          type: string
    WorkspaceInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        slug:
          type: string
          description: >-
            Create only; derived from name when omitted. Reserved slugs are
            rejected. Ignored on update.
        description:
          type: string
        settings:
          type: object
          properties:
            timezone:
              type: string
            date_format:
              type: string
            status_page_theme:
              type: string
            branding:
              type: object
              properties:
                logo_url:
                  type: string
                favicon_url:
                  type: string
                primary_color:
                  type: string
                accent_color:
                  type: string
                custom_css:
                  type: string
                hide_powered_by:
                  type: boolean
            notifications:
              type: object
              properties:
                digest_enabled:
                  type: boolean
                digest_frequency:
                  type: string
                  enum:
                  - hourly
                  - daily
                  - weekly
                alert_threshold:
                  type: integer
                excluded_channels:
                  type: array
                  items:
                    type: string
    MCPRequest:
      type: object
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          description: Request ID (string or number), echoed in the response.
        method:
          type: string
          enum:
          - initialize
          - tools/list
          - tools/call
          - resources/list
          - resources/read
          - prompts/list
          - prompts/get
        params:
          type: object
    PaginatedSouls:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Soul'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        next_offset:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
  responses:
    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LeaderUnavailableError:
      description: >-
        The cluster has no reachable Raft leader (an election is in progress
        or this node is cut off from the majority). The write was not applied
        and can be retried after Retry-After seconds. The body may name the
        last known leader.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              leader:
                type: string
    RateLimitError:
      description: Too many requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

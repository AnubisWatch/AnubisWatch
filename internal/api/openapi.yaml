        in: query
        description: ID of the last judgment of the previous page
        schema:
          type: string
      responses:
        '200':
          description: One page of judgments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Judgment'
                  total:
                    type: integer

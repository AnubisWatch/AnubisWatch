        Soul counts by current status (latest judgment in the last 24 hours;
        none means unknown, an active maintenance window means embalmed),
        judgment totals for the last 24 hours, and alert manager statistics.
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                type: object
                required: [souls, judgments, alerts]
                properties:
                  souls:
                    type: object
                    required: [total, healthy, degraded, dead, unknown, embalmed]
                    properties:
                      total:
                        type: integer
                      healthy:
                        type: integer
                      degraded:
                        type: integer
                      dead:
                        type: integer
                      unknown:
                        type: integer
                      embalmed:
                        type: integer
                  judgments:
                    type: object
                    required: [today, failures, avg_latency_ms]
                    properties:
                      today:
                        type: integer
                      failures:
                        type: integer
                      avg_latency_ms:
                        type: number
                  alerts:
                    $ref: '#/components/schemas/AlertManagerStats'
      security:
      - BearerAuth: []
      summary: Stats overview
      tags:
      - Stats

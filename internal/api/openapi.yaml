# AnubisWatch REST API — OpenAPI specification.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR THE API SURFACE.
# It is embedded into the binary (see openapi.go) and served verbatim at
# /api/openapi.yaml, converted to JSON at /api/openapi.json, and rendered by
# /api/docs. There is no second, hardcoded copy any more — there used to be
# three documents that disagreed (a hand-maintained YAML under docs/ that was
# never served, a hardcoded JSON blob in rest.go, and a Go map that merged
# extra paths into it).
#
# TestOpenAPISpecCoversEveryRoute in openapi_test.go fails the build if a route
# is registered without a matching operation here, so adding an endpoint means
# adding it below.
#
# Paths are absolute and include the /api/v1 prefix where it applies, because
# /health, /ready, /metrics and the public status pages do not live under it.

openapi: 3.0.3
info:
  title: AnubisWatch API
  description: |
    Zero-dependency uptime and synthetic monitoring platform API.

    ## Authentication
    All API endpoints require authentication via Bearer token in the Authorization header:
    ```
    Authorization: Bearer <your-token>
    ```

    ## Rate Limiting
    API requests are rate limited per IP and per user:
    - 100 requests/minute for standard endpoints
    - 10 requests/minute for authentication endpoints
    - 20 requests/minute for sensitive operations

    Rate limit headers are included in responses:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Remaining requests in window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets
  # Version of the API contract, not of the product. The routes are served
  # under /api/v1, so the contract is 1.x. (The two documents this file
  # replaced claimed 3.0.0 and 4.0.0; neither corresponded to anything.)
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AnubisWatch Team
    url: https://anubis.watch
    email: team@anubis.watch
servers:
- url: http://localhost:8080
  description: Local development server
- url: https://api.anubis.watch
  description: Production server
security:
- bearerAuth: []
tags:
- name: Authentication
  description: User authentication and session management
- name: Souls
  description: Monitored targets management
- name: Judgments
  description: Health check results
- name: Alerts
  description: Alert channels and rules
- name: Cluster
  description: Raft cluster management
- name: Journeys
  description: Multi-step synthetic monitoring
- name: Status Pages
  description: Public status page configuration
- name: System
  description: System health and metrics
paths:
  /api/docs:
    get:
      responses:
        '200':
          description: Interactive API documentation
      summary: Swagger UI documentation
      tags:
      - System
  /api/openapi.json:
    get:
      responses:
        '200':
          description: OpenAPI document
      summary: OpenAPI JSON specification
      tags:
      - System
  /api/openapi.yaml:
    get:
      responses:
        '200':
          description: OpenAPI document in its authored YAML form
      summary: OpenAPI YAML specification
      tags:
      - System
  /api/v1/alerts/channels:
    get:
      tags:
      - Alerts
      summary: List alert channels
      description: Retrieve all configured alert channels
      responses:
        '200':
          description: List of alert channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertChannel'
    post:
      tags:
      - Alerts
      summary: Create alert channel
      description: Create a new alert channel (email, webhook, slack, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertChannelCreate'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertChannel'
  /api/v1/alerts/channels/{id}:
    get:
      summary: Get an alert channel
      tags:
      - Alerts
      security: &id001
      - bearerAuth: []
      parameters:
      - &id002
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel
        '404':
          description: Not found
    put:
      summary: Update an alert channel
      tags:
      - Alerts
      description: Requires the channels:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Channel updated
        '403':
          description: Insufficient role
    delete:
      summary: Delete an alert channel
      tags:
      - Alerts
      description: Requires the channels:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '204':
          description: Channel deleted
        '403':
          description: Insufficient role
  /api/v1/alerts/channels/{id}/test:
    post:
      summary: Send a test notification through a channel
      tags:
      - Alerts
      description: Requires the channels:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Test dispatched
        '403':
          description: Insufficient role
  /api/v1/alerts/rules:
    get:
      tags:
      - Alerts
      summary: List alert rules
      description: Retrieve all configured alert rules
      responses:
        '200':
          description: List of alert rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
    post:
      tags:
      - Alerts
      summary: Create alert rule
      description: Create a new alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleCreate'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
  /api/v1/alerts/rules/{id}:
    get:
      summary: Get an alert rule
      tags:
      - Alerts
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Rule
        '404':
          description: Not found
    put:
      summary: Update an alert rule
      tags:
      - Alerts
      description: Requires the rules:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Rule updated
        '403':
          description: Insufficient role
    delete:
      summary: Delete an alert rule
      tags:
      - Alerts
      description: Requires the rules:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '204':
          description: Rule deleted
        '403':
          description: Insufficient role
  /api/v1/auth/change-password:
    put:
      summary: Change the authenticated user's password
      tags:
      - Authentication
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password changed
        '400':
          description: New password fails the password policy
        '401':
          description: Current password is incorrect
  /api/v1/auth/methods:
    get:
      tags:
      - Authentication
      summary: Available sign-in methods
      description: >-
        Public. Tells the login page which sign-in methods exist so it can
        offer an SSO button (GET /api/v1/auth/oidc/login) and/or the password
        form. Exposes no configuration details or user data. The password
        form applies when local or ldap is true.
      security: []
      responses:
        '200':
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                required:
                - local
                - oidc
                - ldap
                properties:
                  local:
                    type: boolean
                    description: Local accounts can sign in with a password (local and OIDC auth types)
                  oidc:
                    type: boolean
                    description: The OIDC redirect flow is available
                  ldap:
                    type: boolean
                    description: Passwords are checked against LDAP
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: User login
      description: Authenticate a user and return a JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: User logout
      description: Invalidate the current authentication token
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Get current user
      description: Retrieve information about the currently authenticated user
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v1/auth/oidc/callback:
    get:
      summary: OIDC redirect endpoint
      tags:
      - Authentication
      description: Registered only when an OIDC issuer is configured.
      security: &id003 []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the dashboard with a session established
        '401':
          description: State or token validation failed
  /api/v1/auth/oidc/login:
    get:
      summary: Begin the OIDC authorization-code flow
      tags:
      - Authentication
      description: Registered only when an OIDC issuer is configured.
      security: *id003
      responses:
        '302':
          description: Redirect to the identity provider
        '404':
          description: OIDC is not configured
  /api/v1/auth/reset-password:
    post:
      summary: Request a password reset token
      tags:
      - Authentication
      description: Always returns 200 regardless of whether the address exists; the response does not
        reveal account existence.
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset requested (response is identical for unknown addresses)
  /api/v1/auth/reset-password/confirm:
    post:
      summary: Complete a password reset
      tags:
      - Authentication
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password reset
        '400':
          description: Token invalid, expired, or password fails policy
  /api/v1/auth/workspace:
    post:
      summary: Switch active workspace
      tags:
      - Authentication
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace_id
              properties:
                workspace_id:
                  type: string
      responses:
        '200':
          description: Active workspace switched
        '403':
          description: Not a member of that workspace
  /api/v1/channels:
    get:
      responses:
        '200':
          description: Paginated list
      security:
      - BearerAuth: []
      summary: List channels
      tags:
      - Alerts
    post:
      responses:
        '201':
          description: Channel created
      security:
      - BearerAuth: []
      summary: Create channel
      tags:
      - Alerts
  /api/v1/channels/{id}:
    delete:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Channel deleted
      security:
      - BearerAuth: []
      summary: Delete channel
      tags:
      - Alerts
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel details
      security:
      - BearerAuth: []
      summary: Get channel
      tags:
      - Alerts
    put:
      responses:
        '200':
          description: Channel updated
      security:
      - BearerAuth: []
      summary: Update channel
      tags:
      - Alerts
  /api/v1/channels/{id}/test:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Test sent
      security:
      - BearerAuth: []
      summary: Test channel
      tags:
      - Alerts
  /api/v1/cluster/nodes:
    post:
      tags:
      - Cluster
      summary: Add a cluster node
      description: >-
        Add a voting member to the Raft cluster through a replicated
        joint-consensus configuration change, so every node agrees on the new
        membership. Any node accepts the request; a follower forwards it to
        the leader over the Raft transport. One change is processed at a
        time. When node_id is omitted the node listening on address is asked
        for its node ID (and its region, unless region is given) over the
        Raft transport, so it can be added by address alone. Start the new
        node with necropolis.raft.join (anubis serve --join) or with the
        existing members as its peers, so it does not elect itself. Requires
        the members:* role.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterNodeRequest'
      responses:
        '201':
          description: Node added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterNodeRequest'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Insufficient role
        '409':
          description: >-
            Clustering is not enabled on this node, or the node is already a
            member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            node_id was omitted and the node at address could not be reached
            to learn it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/cluster/nodes/{id}:
    delete:
      tags:
      - Cluster
      summary: Remove a cluster node
      description: >-
        Remove a member from the Raft cluster through a replicated
        joint-consensus configuration change. Any node accepts the request; a
        follower forwards it to the leader. The current leader cannot be
        removed (there is no leadership transfer). The souls the node owned
        move to the remaining members. Requires the members:* role.
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Node removed
        '403':
          description: Insufficient role
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: >-
            Clustering is not enabled on this node, or the node is the current
            leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/cluster/peers:
    get:
      tags:
      - Cluster
      summary: List peers
      description: >-
        This node followed by every Raft peer it knows about. Always an array;
        a standalone node returns a single entry for itself with state
        "leader" and is_leader true.
      responses:
        '200':
          description: List of peers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peer'
  /api/v1/cluster/status:
    get:
      tags:
      - Cluster
      summary: Cluster status
      description: Retrieve the current cluster status and node information
      responses:
        '200':
          description: Cluster status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'
  /api/v1/config:
    get:
      description: >-
        Settings shown on the Settings page. Presentation keys (instance_name,
        timezone, theme) are editable and persisted; every key in
        read_only_keys reflects the running config file.
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UIConfig'
      security:
      - BearerAuth: []
      summary: Get config
      tags:
      - Config
    put:
      description: >-
        Update presentation settings. Only instance_name, timezone
        and theme are accepted; a string sets the value and null restores the
        default. Any other key is rejected with 400 ("<key> is set in the
        config file and cannot be changed at runtime"). Values persist across
        restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UIConfigUpdate'
      responses:
        '200':
          description: Config updated; the full GET payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UIConfig'
        '400':
          description: Invalid JSON, a read-only or unknown key, or an invalid value
      security:
      - BearerAuth: []
      summary: Update config
      tags:
      - Config
  /api/v1/dashboards:
    get:
      responses:
        '200':
          description: List
      security:
      - BearerAuth: []
      summary: List dashboards
      tags:
      - Dashboards
    post:
      responses:
        '201':
          description: Created
      security:
      - BearerAuth: []
      summary: Create dashboard
      tags:
      - Dashboards
  /api/v1/dashboards/templates:
    get:
      responses:
        '200':
          description: Templates
      security:
      - BearerAuth: []
      summary: Dashboard templates
      tags:
      - Dashboards
  /api/v1/dashboards/{id}:
    delete:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
      security:
      - BearerAuth: []
      summary: Delete dashboard
      tags:
      - Dashboards
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Details
      security:
      - BearerAuth: []
      summary: Get dashboard
      tags:
      - Dashboards
    put:
      responses:
        '200':
          description: Updated
      security:
      - BearerAuth: []
      summary: Update dashboard
      tags:
      - Dashboards
  /api/v1/dashboards/{id}/query:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Query results
      security:
      - BearerAuth: []
      summary: Query dashboard
      tags:
      - Dashboards
  /api/v1/events:
    get:
      responses:
        '200':
          description: Stream
      summary: SSE stream
      tags:
      - SSE
  /api/v1/incidents:
    get:
      responses:
        '200':
          description: List of incidents
      security:
      - BearerAuth: []
      summary: List incidents
      tags:
      - Incidents
  /api/v1/incidents/{id}/acknowledge:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Acknowledged
      security:
      - BearerAuth: []
      summary: Acknowledge incident
      tags:
      - Incidents
  /api/v1/incidents/{id}/resolve:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Resolved
      security:
      - BearerAuth: []
      summary: Resolve incident
      tags:
      - Incidents
  /api/v1/journeys:
    get:
      tags:
      - Journeys
      summary: List journeys
      description: >-
        One page of journeys ordered by ID, as a bare array. The total number
        of journeys is in the X-Total-Count header; page with offset/limit.
      parameters:
      - name: offset
        in: query
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        description: Page size; values above 100 are clamped to 100.
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: List of journeys
          headers:
            X-Total-Count:
              description: Total number of journeys in the workspace
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Journey'
    post:
      tags:
      - Journeys
      summary: Create journey
      description: Create a new multi-step synthetic monitoring journey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JourneyCreate'
      responses:
        '201':
          description: Journey created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Journey'
  /api/v1/journeys/{id}:
    delete:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
      security:
      - BearerAuth: []
      summary: Delete journey
      tags:
      - Journeys
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Details
      security:
      - BearerAuth: []
      summary: Get journey
      tags:
      - Journeys
    put:
      responses:
        '200':
          description: Updated
      security:
      - BearerAuth: []
      summary: Update journey
      tags:
      - Journeys
  /api/v1/journeys/{id}/run:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Journeys
      summary: Run journey
      description: Execute a synthetic monitoring journey immediately
      responses:
        '200':
          description: Journey execution started
          content:
            application/json:
              schema:
                type: object
                properties:
                  journey_id:
                    type: string
                  status:
                    type: string
                    example: execution_requested
  /api/v1/journeys/{id}/runs:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List
      security:
      - BearerAuth: []
      summary: List journey runs
      tags:
      - Journeys
  /api/v1/journeys/{id}/runs/{runId}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: runId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Run details
      security:
      - BearerAuth: []
      summary: Get journey run
      tags:
      - Journeys
  /api/v1/judgments:
    get:
      tags:
      - Judgments
      summary: List all judgments
      description: Retrieve recent health check results across all souls
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 100
      responses:
        '200':
          description: List of judgments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Judgment'
  /api/v1/judgments/{id}:
    get:
      summary: Get a single judgment
      tags:
      - Judgments
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Judgment
        '404':
          description: Not found
  /api/v1/maintenance:
    get:
      responses:
        '200':
          description: List
      security:
      - BearerAuth: []
      summary: List maintenance windows
      tags:
      - Maintenance

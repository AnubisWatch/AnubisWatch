        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: The role lacks judgments:read
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          description: The report exceeded its 60-second time budget; pick a shorter period or one soul.
  /api/v1/souls/{id}/heartbeat:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - Souls
      summary: Heartbeat ping URLs and last ping
      description: >-
        For a heartbeat (push) soul: its expected interval and grace, the
        ping state (last ping time, event, measured run duration, failure
        message) and, for roles that may edit souls, the secret ping token
        and URLs. Soul list/get responses always redact the token.
      responses:
        '200':
          description: Heartbeat info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatInfo'
        '400':
          description: Soul is not a heartbeat monitor
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Soul belongs to another workspace
        '404':
          description: Soul not found
  /api/v1/souls/{id}/heartbeat/rotate:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - Souls
      summary: Rotate a heartbeat ping token
      description: >-
        Generates a new ping token. The old ping URL stops working
        immediately; update the job's ping URL afterwards.
      responses:
        '200':
          description: New token and ping URLs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatInfo'
        '400':
          description: Soul is not a heartbeat monitor
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Insufficient role or soul belongs to another workspace
        '404':
          description: Soul not found
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/heartbeat/{token}:
    parameters:
    - &id_hb_token
      name: token
      in: path
      required: true
      description: The heartbeat soul's secret ping token.
      schema:
        type: string
    get:
      tags:
      - Souls
      summary: Heartbeat ping (success)
      description: &id_hb_ping_desc >-
        Public, token-authenticated ping from a cron job or worker; no session
        or API key. Records a success: the soul's owner records an alive
        judgment (duration = time since the last /start). When no ping
        arrives within the soul's weight (interval) plus grace, the soul is
        judged dead, and again every interval until a ping arrives. Answers
        a plain-text "OK". Limited to 30 pings per token per minute on top
        of the per-IP limit. Example cron line:
        `0 3 * * * /usr/local/bin/backup.sh && curl -fsS -m 10 --retry 3 https://anubis.example.com/api/v1/heartbeat/TOKEN`
      security: []
      responses: &id_hb_responses
        '200':
          description: Ping recorded
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '404':
          description: Unknown token
        '429':
          description: Too many pings for this token
        '503':
          description: Cluster leader unavailable; retry
    post:
      tags:
      - Souls
      summary: Heartbeat ping (success)
      description: *id_hb_ping_desc
      security: []
      responses: *id_hb_responses
  /api/v1/heartbeat/{token}/start:
    parameters:
    - *id_hb_token
    get:
      tags:
      - Souls
      summary: Heartbeat run started
      description: &id_hb_start_desc >-
        Marks the start of a run; the next success or fail ping records the
        time since this start as the judgment's duration. Records no
        judgment and does not reset the deadline.
      security: []
      responses: *id_hb_responses
    post:
      tags:
      - Souls
      summary: Heartbeat run started
      description: *id_hb_start_desc
      security: []
      responses: *id_hb_responses
  /api/v1/heartbeat/{token}/fail:
    parameters:
    - *id_hb_token
    get:
      tags:
      - Souls
      summary: Heartbeat failure
      description: >-
        Records an explicit failure (a dead judgment). The optional message is
        the msg query parameter.
      parameters:
      - name: msg
        in: query
        schema:
          type: string
          maxLength: 1024
      security: []
      responses: *id_hb_responses
    post:
      tags:
      - Souls
      summary: Heartbeat failure
      description: >-
        Records an explicit failure (a dead judgment). The request body, of
        any content type, is the failure message (first 1KB kept, control
        characters removed), e.g. `curl -fsS --data-binary @/tmp/job.log
        https://anubis.example.com/api/v1/heartbeat/TOKEN/fail`.
      security: []
      requestBody:
        required: false
        content:
          text/plain:
            schema:
              type: string
              maxLength: 1024
      responses: *id_hb_responses
  /api/v1/souls/{id}/logs:

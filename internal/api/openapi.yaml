# AnubisWatch REST API — OpenAPI specification.
#
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR THE API SURFACE.
# It is embedded into the binary (see openapi.go) and served verbatim at
# /api/openapi.yaml, converted to JSON at /api/openapi.json, and rendered by
# /api/docs. There is no second, hardcoded copy any more — there used to be
# three documents that disagreed (a hand-maintained YAML under docs/ that was
# never served, a hardcoded JSON blob in rest.go, and a Go map that merged
# extra paths into it).
#
# TestOpenAPISpecCoversEveryRoute in openapi_test.go fails the build if a route
# is registered without a matching operation here, so adding an endpoint means
# adding it below.
#
# Paths are absolute and include the /api/v1 prefix where it applies, because
# /health, /ready, /metrics and the public status pages do not live under it.

openapi: 3.0.3
info:
  title: AnubisWatch API
  description: |
    Zero-dependency uptime and synthetic monitoring platform API.

    ## Authentication
    All API endpoints require authentication via Bearer token in the Authorization header:
    ```
    Authorization: Bearer <your-token>
    ```

    ## Rate Limiting
    API requests are rate limited per IP and per user:
    - 100 requests/minute for standard endpoints
    - 10 requests/minute for authentication endpoints
    - 20 requests/minute for sensitive operations

    Rate limit headers are included in responses:
    - `X-RateLimit-Limit`: Maximum requests allowed
    - `X-RateLimit-Remaining`: Remaining requests in window
    - `X-RateLimit-Reset`: Unix timestamp when limit resets
  # Version of the API contract, not of the product. The routes are served
  # under /api/v1, so the contract is 1.x. (The two documents this file
  # replaced claimed 3.0.0 and 4.0.0; neither corresponded to anything.)
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: AnubisWatch Team
    url: https://anubis.watch
    email: team@anubis.watch
servers:
- url: http://localhost:8080
  description: Local development server
- url: https://api.anubis.watch
  description: Production server
security:
- bearerAuth: []
tags:
- name: Authentication
  description: User authentication and session management
- name: Souls
  description: Monitored targets management
- name: Judgments
  description: Health check results
- name: Alerts
  description: Alert channels and rules
- name: Cluster
  description: Raft cluster management
- name: Journeys
  description: Multi-step synthetic monitoring
- name: API Keys
  description: Long-lived bearer credentials for automation
- name: Members
  description: Accounts, workspace roles and invitations
- name: Status Pages
  description: Public status page configuration
- name: System
  description: System health and metrics
- name: Reports
  description: SLA reports and judgment export
paths:
  /api/docs:
    get:
      responses:
        '200':
          description: Interactive API documentation
      summary: Swagger UI documentation
      tags:
      - System
  /api/openapi.json:
    get:
      responses:
        '200':
          description: OpenAPI document
      summary: OpenAPI JSON specification
      tags:
      - System
  /api/openapi.yaml:
    get:
      responses:
        '200':
          description: OpenAPI document in its authored YAML form
      summary: OpenAPI YAML specification
      tags:
      - System
  /api/v1/alerts/channels:
    get:
      deprecated: true
      tags:
      - Alerts
      summary: List alert channels
      description: Retrieve all configured alert channels
      responses:
        '200':
          description: List of alert channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertChannel'
    post:
      deprecated: true
      tags:
      - Alerts
      summary: Create alert channel
      description: Create a new alert channel (email, webhook, slack, etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertChannelCreate'
      responses:
        '201':
          description: Channel created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertChannel'
        '409':
          $ref: '#/components/responses/QuotaExceeded'
  /api/v1/alerts/channels/{id}:
    get:
      deprecated: true
      summary: Get an alert channel
      tags:
      - Alerts
      security: &id001
      - bearerAuth: []
      parameters:
      - &id002
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel
        '404':
          description: Not found
    put:
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertChannelCreate'
      summary: Update an alert channel
      tags:
      - Alerts
      description: Requires the channels:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Channel updated
        '403':
          description: Insufficient role
    delete:
      deprecated: true
      summary: Delete an alert channel
      tags:
      - Alerts
      description: Requires the channels:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '204':
          description: Channel deleted
        '403':
          description: Insufficient role
  /api/v1/alerts/channels/{id}/test:
    post:
      deprecated: true
      summary: Send a test notification through a channel
      tags:
      - Alerts
      description: Requires the channels:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Test dispatched
        '403':
          description: Insufficient role
  /api/v1/alerts/rules:
    get:
      deprecated: true
      tags:
      - Alerts
      summary: List alert rules
      description: Retrieve all configured alert rules
      responses:
        '200':
          description: List of alert rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertRule'
    post:
      deprecated: true
      tags:
      - Alerts
      summary: Create alert rule
      description: Create a new alert rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleCreate'
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRule'
  /api/v1/alerts/rules/{id}:
    get:
      deprecated: true
      summary: Get an alert rule
      tags:
      - Alerts
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Rule
        '404':
          description: Not found
    put:
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRuleCreate'
      summary: Update an alert rule
      tags:
      - Alerts
      description: Requires the rules:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '200':
          description: Rule updated
        '403':
          description: Insufficient role
    delete:
      deprecated: true
      summary: Delete an alert rule
      tags:
      - Alerts
      description: Requires the rules:* role.
      security: *id001
      parameters:
      - *id002
      responses:
        '204':
          description: Rule deleted
        '403':
          description: Insufficient role
  /api/v1/api-keys:
    get:
      description: >-
        Lists the current workspace's API keys, including revoked and expired
        ones. The secret and its hash are never returned. Requires the
        apikeys permission (admin, owner) and an interactive session: a
        request authenticated with an API key is refused with 403.
      responses:
        '200':
          description: API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/APIKey'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Missing permission, or the caller is an API key
      security:
      - BearerAuth: []
      summary: List API keys
      tags:
      - API Keys
    post:
      description: >-
        Issues an API key ("anb_<id>_<secret>") in the caller's workspace. The
        plaintext is in the response's `key` field and is never shown again;
        only its SHA-256 is stored. The role defaults to the caller's and may
        not rank above it (owner > admin > editor > api > viewer). Expiry is
        optional and at most 366 days away. Send it as
        `Authorization: Bearer anb_...` on REST, gRPC metadata, WebSocket and SSE.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIKeyCreate'
      responses:
        '201':
          description: Created; `key` holds the one-time plaintext
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Role above the caller's, missing permission, or the caller is an API key
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
      security:
      - BearerAuth: []
      summary: Create API key
      tags:
      - API Keys
  /api/v1/api-keys/{id}:
    delete:
      description: >-
        Revokes a key in the caller's workspace. Revocation is immediate and
        permanent; open WebSocket/SSE streams using the key close within the
        session re-check interval. Revoking an already revoked key is a no-op.
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Revoked key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Missing permission, or the caller is an API key
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
      security:
      - BearerAuth: []
      summary: Revoke API key
      tags:
      - API Keys
  /api/v1/auth/change-password:
    put:
      summary: Change the authenticated user's password
      tags:
      - Authentication
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - new_password
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password changed
        '400':
          description: New password fails the password policy
        '401':
          description: Current password is incorrect
  /api/v1/branding:
    get:
      tags:
      - Authentication
      summary: Dashboard branding
      description: >-
        Public. The dashboard's title, logo and default theme from
        dashboard.branding, so the login page can show them. Holds nothing
        secret.
      security: []
      responses:
        '200':
          description: Branding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardBranding'
  /api/v1/auth/methods:
    get:
      tags:
      - Authentication
      summary: Available sign-in methods
      description: >-
        Public. Tells the login page which sign-in methods exist so it can
        offer an SSO button (GET /api/v1/auth/oidc/login) and/or the password
        form. Exposes no configuration details or user data. The password
        form applies when local or ldap is true. password_reset is true when
        outgoing mail (mail.host) is configured, so the login page can offer
        "Forgot password?".
      security: []
      responses:
        '200':
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                required:
                - local
                - oidc
                - ldap
                properties:
                  local:
                    type: boolean
                    description: Local accounts can sign in with a password (local and OIDC auth types)
                  oidc:
                    type: boolean
                    description: The OIDC redirect flow is available
                  ldap:
                    type: boolean
                    description: Passwords are checked against LDAP
                  password_reset:
                    type: boolean
                    description: POST /api/v1/auth/reset-password emails a reset link (mail is configured)
  /api/v1/auth/login:
    post:
      tags:
      - Authentication
      summary: User login
      description: Authenticate a user and return a JWT token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: secret123
      responses:
        '200':
          description: >-
            Login successful. The session token is set as the httpOnly
            auth_token cookie, not returned in the body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication
      summary: User logout
      description: Invalidate the current authentication token
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
  /api/v1/auth/me:
    get:
      tags:
      - Authentication
      summary: Get current user
      description: Retrieve information about the currently authenticated user
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v1/auth/oidc/callback:
    get:
      summary: OIDC redirect endpoint
      tags:
      - Authentication
      description: Registered only when an OIDC issuer is configured.
      security: &id003 []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Session established (API clients; Accept without text/html). The session is set as the HttpOnly auth_token cookie; the body holds only the user.
        '303':
          description: Browser navigation (Accept includes text/html). Redirects to / with the auth_token cookie set, or to /login?sso_error=1 on any failure.
        '400':
          description: Provider error, missing code/state, or missing/mismatched oidc_state/oidc_nonce cookies (API clients)
        '401':
          description: State or token validation failed (API clients)
  /api/v1/auth/oidc/login:
    get:
      summary: Begin the OIDC authorization-code flow
      tags:
      - Authentication
      description: Registered only when an OIDC issuer is configured.
      security: *id003
      responses:
        '302':
          description: Redirect to the identity provider
        '404':
          description: OIDC is not configured
  /api/v1/auth/reset-password:
    post:
      summary: Request a password reset token
      tags:
      - Authentication
      description: >-
        Always returns 200 regardless of whether the address exists; the
        response does not reveal account existence. When outgoing mail is
        configured (mail.host and server.public_url), the token is emailed as a
        link to the dashboard page {server.public_url}/reset-password?token=...
        (at most 3 emails per address per hour). Otherwise there is no
        delivery channel and the message points to `anubis admin reset-password`.
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Reset requested (response is identical for unknown addresses)
  /api/v1/auth/reset-password/confirm:
    post:
      summary: Complete a password reset
      tags:
      - Authentication
      security: *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              - new_password
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password reset
        '400':
          description: Token invalid, expired, or password fails policy
  /api/v1/auth/workspace:
    post:
      summary: Switch active workspace
      tags:
      - Authentication
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - workspace
              properties:
                workspace:
                  type: string
      responses:
        '200':
          description: Active workspace switched
        '403':
          description: Not a member of that workspace
  /api/v1/channels:
    get:
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertChannel'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
      security:
      - BearerAuth: []
      summary: List channels
      tags:
      - Alerts
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertChannelCreate'
      responses:
        '201':
          description: Channel created
        '409':
          $ref: '#/components/responses/QuotaExceeded'
      security:
      - BearerAuth: []
      summary: Create channel
      tags:
      - Alerts
  /api/v1/channels/{id}:
    delete:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Channel deleted
      security:
      - BearerAuth: []
      summary: Delete channel
      tags:
      - Alerts
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Channel details
      security:
      - BearerAuth: []
      summary: Get channel
      tags:
      - Alerts
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertChannelCreate'
      responses:
        '200':
          description: Channel updated
      security:
      - BearerAuth: []
      summary: Update channel
      tags:
      - Alerts
  /api/v1/channels/{id}/test:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Test sent
      security:
      - BearerAuth: []
      summary: Test channel
      tags:
      - Alerts
  /api/v1/cluster/nodes:
    post:
      tags:
      - Cluster
      summary: Add a cluster node
      description: >-
        Add a voting member to the Raft cluster through a replicated
        joint-consensus configuration change, so every node agrees on the new
        membership. Any node accepts the request; a follower forwards it to
        the leader over the Raft transport. One change is processed at a
        time. When node_id is omitted the node listening on address is asked
        for its node ID (and its region, unless region is given) over the
        Raft transport, so it can be added by address alone. Start the new
        node with necropolis.raft.join (anubis serve --join) or with the
        existing members as its peers, so it does not elect itself. Requires
        the members:* role.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterNodeRequest'
      responses:
        '201':
          description: Node added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterNodeRequest'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '403':
          description: Insufficient role
        '409':
          description: >-
            Clustering is not enabled on this node, or the node is already a
            member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: >-
            node_id was omitted and the node at address could not be reached
            to learn it
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/cluster/nodes/{id}:
    delete:
      tags:
      - Cluster
      summary: Remove a cluster node
      description: >-
        Remove a member from the Raft cluster through a replicated
        joint-consensus configuration change. Any node accepts the request; a
        follower forwards it to the leader. The current leader cannot be
        removed (there is no leadership transfer). The souls the node owned
        move to the remaining members. Requires the members:* role.
      security:
      - BearerAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Node removed
        '403':
          description: Insufficient role
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          description: >-
            Clustering is not enabled on this node, or the node is the current
            leader
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/LeaderUnavailableError'
  /api/v1/cluster/peers:
    get:
      tags:
      - Cluster
      summary: List peers
      description: >-
        This node followed by every Raft peer it knows about. Always an array;
        a standalone node returns a single entry for itself with state
        "leader" and is_leader true.
      responses:
        '200':
          description: List of peers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Peer'
  /api/v1/cluster/status:
    get:
      tags:
      - Cluster
      summary: Cluster status
      description: Retrieve the current cluster status and node information
      responses:
        '200':
          description: Cluster status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatus'
  /api/v1/config:
    get:
      description: >-
        Settings shown on the Settings page. Presentation keys (instance_name,
        timezone, theme) are editable and persisted; every key in
        read_only_keys reflects the running config file.
      responses:
        '200':
          description: Configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UIConfig'
      security:
      - BearerAuth: []
      summary: Get config
      tags:
      - Config
    put:
      description: >-
        Update presentation settings. Only instance_name, timezone
        and theme are accepted; a string sets the value and null restores the
        default. Any other key is rejected with 400 ("<key> is set in the
        config file and cannot be changed at runtime"). Values persist across
        restarts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UIConfigUpdate'
      responses:
        '200':
          description: Config updated; the full GET payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UIConfig'
        '400':
          description: Invalid JSON, a read-only or unknown key, or an invalid value
      security:
      - BearerAuth: []
      summary: Update config
      tags:
      - Config
  /api/v1/dashboards:
    get:
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomDashboard'
      security:
      - BearerAuth: []
      summary: List dashboards
      tags:
      - Dashboards
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomDashboardInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomDashboard'
      security:
      - BearerAuth: []
      summary: Create dashboard
      tags:
      - Dashboards
  /api/v1/dashboards/templates:
    get:
      responses:
        '200':
          description: Templates
      security:
      - BearerAuth: []
      summary: Dashboard templates
      tags:
      - Dashboards
  /api/v1/dashboards/{id}:
    delete:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Deleted
      security:
      - BearerAuth: []
      summary: Delete dashboard
      tags:
      - Dashboards
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Details
          content:
            application/json:
              schema:

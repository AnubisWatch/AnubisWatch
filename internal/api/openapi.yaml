components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - user
          - viewer
        workspace:
          type: string
        created_at:
          type: string
          format: date-time
    Soul:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - http
          - tcp
          - udp
          - dns
          - smtp
          - icmp
          - grpc
          - websocket
          - tls
        target:
          type: string
        status:
          type: string
          enum:
          - alive
          - dead
          - degraded
          - unknown
          - embalmed
        weight:
          type: integer
        timeout:
          type: integer
        interval:
          type: integer
        http_config:
          $ref: '#/components/schemas/HTTPConfig'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SoulCreate:
      type: object
      required:
      - name
      - type
      - target
      properties:
        name:
          type: string
        type:
          type: string
        target:
          type: string
        weight:
          type: integer
        timeout:
          type: integer
        interval:
          type: integer
        http_config:
          $ref: '#/components/schemas/HTTPConfig'
    SoulUpdate:
      allOf:
      - $ref: '#/components/schemas/SoulCreate'
    HTTPConfig:
      type: object
      properties:
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        valid_status:
          type: array
          items:
            type: integer
        follow_redirects:
          type: boolean
        verify_tls:
          type: boolean
    Judgment:
      type: object
      properties:
        id:
          type: string
        soul_id:
          type: string
        status:
          type: string
          enum:
          - pass
          - fail
        latency_ms:
          type: integer
        timestamp:
          type: string
          format: date-time
        error:
          type: string
    AlertChannel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - email
          - webhook
          - slack
          - discord
          - pagerduty
        config:
          type: object
        enabled:
          type: boolean
    AlertChannelCreate:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
        config:
          type: object
        enabled:
          type: boolean
          default: true
    AlertRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        condition:
          type: string
        channels:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    AlertRuleCreate:
      type: object
      required:
      - name
      - condition
      properties:
        name:
          type: string
        condition:
          type: string
        channels:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true
    ClusterStatus:
      type: object
      properties:
        is_clustered:
          type: boolean
        node_id:
          type: string
        state:
          type: string
        leader:
          type: string
        term:
          type: integer
        peer_count:
          type: integer
    Peer:
      type: object
      properties:
        id:
          type: string
        address:
          type: string
        region:
          type: string
        role:
          type: string
        last_contact:
          type: string
          format: date-time
    Journey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
    JourneyCreate:
      type: object
      required:
      - name
      - steps
      properties:
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
          default: true
    JourneyStep:
      type: object
      properties:
        name:
          type: string
        target:
          type: string
        method:
          type: string
        assertions:
          type: array
          items:
            type: object
    StatusPage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        souls:
          type: array
          items:
            type: string
    StatusPageCreate:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
        souls:
          type: array
          items:
            type: string
    PaginatedSouls:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Soul'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        next_offset:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
  responses:
    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitError:
      description: Too many requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

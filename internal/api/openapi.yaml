components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum:
          - admin
          - user
          - viewer
        workspace:
          type: string
        created_at:
          type: string
          format: date-time
    Soul:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - http
          - tcp
          - udp
          - dns
          - smtp
          - icmp
          - grpc
          - websocket
          - tls
        target:
          type: string
        status:
          type: string
          description: >-
            Current status from the latest judgment (alive is reported as
            healthy, dead as unhealthy). embalmed means the soul is inside an
            active maintenance window; unknown means it has not been checked.
          enum:
          - healthy
          - unhealthy
          - degraded
          - unknown
          - embalmed
        weight:
          type: integer
        timeout:
          type: integer
        interval:
          type: integer
        http_config:
          $ref: '#/components/schemas/HTTPConfig'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SoulCreate:
      type: object
      required:
      - name
      - type
      - target
      properties:
        name:
          type: string
        type:
          type: string
        target:
          type: string
        weight:
          type: integer
        timeout:
          type: integer
        interval:
          type: integer
        http_config:
          $ref: '#/components/schemas/HTTPConfig'
    SoulUpdate:
      allOf:
      - $ref: '#/components/schemas/SoulCreate'
    HTTPConfig:
      type: object
      properties:
        method:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        valid_status:
          type: array
          items:
            type: integer
        follow_redirects:
          type: boolean
        verify_tls:
          type: boolean
    UptimeWindow:
      type: object
      properties:
        checks:
          type: integer
        up:
          type: integer
        failures:
          type: integer
        uptime_percent:
          type: number
          nullable: true
          description: Null when there were no checks in the period.
        avg_latency_ms:
          type: number
    Judgment:
      type: object
      properties:
        id:
          type: string
        soul_id:
          type: string
        soul_name:
          type: string
          description: >-
            Name of the soul, on list responses (GET /api/v1/judgments and
            GET /api/v1/souls/{id}/judgments)
        status:
          type: string
          enum:
          - alive
          - dead
          - degraded
          - unknown
        latency_ms:
          type: integer
        timestamp:
          type: string
          format: date-time
        error:
          type: string
    AlertChannel:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - email
          - webhook
          - slack
          - discord
          - pagerduty
        config:
          type: object
        enabled:
          type: boolean
    AlertChannelCreate:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          type: string
        config:
          type: object
        enabled:
          type: boolean
          default: true
    AlertRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        condition:
          type: string
        channels:
          type: array
          items:
            type: string
        enabled:
          type: boolean
    AlertRuleCreate:
      type: object
      required:
      - name
      - condition
      properties:
        name:
          type: string
        condition:
          type: string
        channels:
          type: array
          items:
            type: string
        enabled:
          type: boolean
          default: true
    ClusterNodeRequest:
      type: object
      required:
      - address
      properties:
        node_id:
          type: string
          description: >-
            Raft node ID of the member (its necropolis.raft.node_id). Optional
            on add: when omitted it is learned from the node at address.
        address:
          type: string
          description: The member's Raft address, host:port
        region:
          type: string
    ClusterStatus:
      type: object
      properties:
        is_clustered:
          type: boolean
        node_id:
          type: string
        state:
          type: string
        leader:
          type: string
        term:
          type: integer
        peer_count:
          type: integer
    Peer:
      type: object
      required:
      - id
      - name
      - address
      - state
      - last_contact
      - is_leader
      - region
      properties:
        id:
          type: string
        name:
          type: string
        address:
          type: string
        state:
          type: string
          description: leader, follower, candidate, unreachable or unknown
        last_contact:
          type: string
          description: RFC3339 time this node last heard from the peer; empty if never
        is_leader:
          type: boolean
        region:
          type: string
    UIConfig:
      type: object
      properties:
        instance_name:
          type: string
        timezone:
          type: string
        theme:
          type: string
          enum:
          - dark
          - light
          - system
        retention_days:
          type: integer
          description: Raw judgment retention in days; 0 means raw judgments are never pruned
        storage_path:
          type: string
        auth_enabled:
          type: boolean
        auth_type:
          type: string
        mcp_enabled:
          type: boolean
        websocket_enabled:
          type: boolean
        host:
          type: string
        port:
          type: integer
        grpc_port:
          type: integer
        tls_enabled:
          type: boolean
        read_only_keys:
          type: array
          description: Keys that come from the config file and cannot be changed through PUT
          items:
            type: string
    UIConfigUpdate:
      type: object
      additionalProperties: false
      properties:
        instance_name:
          type: string
          nullable: true
          maxLength: 100
        timezone:
          type: string
          nullable: true
          maxLength: 64
        theme:
          type: string
          nullable: true
          enum:
          - dark
          - light
          - system
    Journey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
    JourneyCreate:
      type: object
      required:
      - name
      - steps
      properties:
        name:
          type: string
        description:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/JourneyStep'
        enabled:
          type: boolean
          default: true
    JourneyStep:
      type: object
      properties:
        name:
          type: string
        target:
          type: string
        method:
          type: string
        assertions:
          type: array
          items:
            type: object
    StatusPage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        enabled:
          type: boolean
        souls:
          type: array
          items:
            type: string
    StatusPageCreate:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        enabled:
          type: boolean
          default: true
        souls:
          type: array
          items:
            type: string
    PaginatedSouls:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Soul'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
        next_offset:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        code:
          type: integer
  responses:
    BadRequestError:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedError:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    LeaderUnavailableError:
      description: >-
        The cluster has no reachable Raft leader (an election is in progress
        or this node is cut off from the majority). The write was not applied
        and can be retried after Retry-After seconds. The body may name the
        last known leader.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              leader:
                type: string
    RateLimitError:
      description: Too many requests
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
        X-RateLimit-Remaining:
          schema:
            type: integer
        X-RateLimit-Reset:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
